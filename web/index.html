<html lang="zh-CN" data-theme="dark">

<title>Tick</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232A2D33'/%3E%3Cstop offset='1' stop-color='%230E0F11'/%3E%3C/linearGradient%3E%3ClinearGradient id='r' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237CF2B5'/%3E%3Cstop offset='1' stop-color='%2322B573'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23b)'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='rgba(255,255,255,.12)' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='url(%23r)' stroke-width='6' stroke-linecap='round' pathLength='100' stroke-dasharray='78 100' transform='rotate(-90 32 32)'/%3E%3Cpath d='M24 32.5l5.6 5.6 11-11.8' fill='none' stroke='%23fff' stroke-width='5.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style id="tick-css">
/* ============ Tokens：linear-style-design §2 ============ */
:root{
  --font:"Inter Variable",Inter,"Segoe UI Variable Text","Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei UI",sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",ui-monospace,Consolas,monospace;
  --bg:#08090A; --bg-2:#0F1011; --bg-3:#161718;
  --layer-1:rgba(255,255,255,.02); --layer-2:rgba(255,255,255,.04); --layer-3:rgba(255,255,255,.06);
  --hover:rgba(255,255,255,.05); --active:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.08); --line-soft:rgba(255,255,255,.05); --line-strong:rgba(255,255,255,.12);
  --hi:rgba(255,255,255,.04);
  --text-1:#F7F8F8; --text-2:#D0D6E0; --text-3:#8A8F98; --text-4:#62666D;
  --accent:#5E6AD2; --accent-soft:rgba(94,106,210,.16);
  --btn-primary:#E5E5E6; --btn-primary-text:#08090A;
  --red:#EB5757; --orange:#F2994A; --yellow:#F2C94C; --green:#4CB782; --blue:#4EA7FC;
  --run:var(--brand); /* “进行中”点阵跟主题色走 */
  /* Tick 的品牌色：logo、未读角标、完成提醒 */
  --brand:#4CB782; --brand-hi:#6EE0A6; --brand-lo:#2C9C66;
  --frost:rgba(15,16,17,.78); --glow:rgba(255,255,255,.05);
  --edge:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.04) 42%,rgba(255,255,255,.11));
  --ease:cubic-bezier(.25,.46,.45,.94); --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --t-press:120ms; --t-hover:100ms; --t-pop:180ms; --t-menu:200ms; --t-panel:320ms;
  --r-sm:4px; --r:6px; --r-lg:8px; --r-xl:12px;
  --shadow-pop:0 0 0 1px var(--line),0 16px 48px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#F7F8F8; --bg-2:#FFFFFF; --bg-3:#FFFFFF;
  --layer-1:rgba(0,0,0,.015); --layer-2:rgba(0,0,0,.03); --layer-3:rgba(0,0,0,.045);
  --hover:rgba(0,0,0,.04); --active:rgba(0,0,0,.06);
  --line:rgba(0,0,0,.08); --line-soft:rgba(0,0,0,.05); --line-strong:rgba(0,0,0,.12);
  --hi:rgba(255,255,255,.9);
  --text-1:#08090A; --text-2:#3C3F45; --text-3:#6B6F76; --text-4:#9A9EA6;
  --btn-primary:#08090A; --btn-primary-text:#F7F8F8;
  --frost:rgba(255,255,255,.8); --glow:rgba(94,106,210,.06);
  --edge:linear-gradient(135deg,rgba(94,106,210,.38),rgba(0,0,0,.06) 42%,rgba(94,106,210,.22));
  --shadow-pop:0 0 0 1px var(--line),0 16px 40px -12px rgba(0,0,0,.18);
  color-scheme:light;
}

/* ============ Base ============ */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text-2);font:400 13px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
svg{display:block;flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px;font-variant-ligatures:none}
.t3{color:var(--text-3)} .t4{color:var(--text-4)}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:4px;border:1px solid var(--line);background:var(--layer-3);font:500 11px var(--font);color:var(--text-3)}

/* ============ 按钮 ============ */
.btn{height:26px;padding:0 9px;border-radius:var(--r);display:inline-flex;align-items:center;gap:6px;font-weight:510;font-size:12px;
  border:1px solid var(--line);background:var(--layer-2);color:var(--text-2);white-space:nowrap;
  transition:background-color var(--t-hover) var(--ease),color var(--t-hover) var(--ease),border-color var(--t-hover) var(--ease),transform var(--t-press) var(--ease-out)}
.btn:hover{background:var(--layer-3);color:var(--text-1);border-color:var(--line-strong)}
.btn.primary{background:var(--btn-primary);color:var(--btn-primary-text);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06);background:var(--btn-primary);color:var(--btn-primary-text)}
.btn.ghost{border-color:transparent;background:none}
/* 按钮里的图标一律 14px、不被压缩：各图标画的尺寸不一样（13/14/15），并排时高低、大小会参差 */
.btn>svg{width:14px;height:14px;flex-shrink:0;display:block}
.btn{line-height:1}
.btn.ghost:hover{background:var(--hover)}
.ib{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r);color:var(--text-3);flex-shrink:0;
  transition:background-color var(--t-hover) var(--ease),color var(--t-hover) var(--ease),transform var(--t-press) var(--ease-out)}
.ib:hover{background:var(--hover);color:var(--text-1)}
.ib.on{color:var(--text-1)}
/* 图钉：置顶时实心竖直，取消时空心歪 45°，两态之间过渡 */
.pin-ic{transition:transform var(--t-menu) var(--ease-out)}
.pin-ic .pin-head{fill:currentColor;fill-opacity:0;transition:fill-opacity 160ms var(--ease)}
.pin.on .pin-ic .pin-head{fill-opacity:1}
.pin:not(.on) .pin-ic{transform:rotate(45deg)}
@media (hover:hover) and (pointer:fine){.pin:hover .pin-ic{transform:translateY(1px)}.pin:not(.on):hover .pin-ic{transform:rotate(45deg) translateY(1px)}}
.btn:active,.ib:active{transform:scale(.96)}

/* 状态小图标 */
.ic{flex-shrink:0}
.tile{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:600;letter-spacing:.02em;
  color:var(--text-2);background:var(--layer-3);border:1px solid var(--line);flex-shrink:0}
.tile.sm{width:16px;height:16px;font-size:8px;border-radius:4px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
/* 进度段：每段底色固定，完成时一层填充从左往右铺满；进行中铺到三分之一并有流光 */
.segs{display:flex;gap:2px;height:3px}
.segs i{position:relative;flex:1;min-width:2px;border-radius:2px;background:var(--line-strong);overflow:hidden}
.segs i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--text-2);transform:scaleX(0);transform-origin:left;
  transition:transform 380ms var(--ease-out),background-color 200ms var(--ease)}
.segs i.done::after{transform:none}
.segs i.doing::after{transform:scaleX(.34);background:var(--text-3)}
/* 完成的段用品牌绿渐变；正在做的那段是半透明绿底，上面一道亮光扫过。
   亮光只动 transform（合成器线程处理，不重绘），以前用 background-position 每帧重绘，开着毛玻璃时很吃 CPU */
.segs i.done::after{background:linear-gradient(90deg,var(--brand-lo),var(--brand))}
.segs i.doing.live::after{transform:none;background:color-mix(in srgb,var(--brand) 38%,transparent)}
.segs i.doing.live::before{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;
  background:linear-gradient(90deg,transparent,var(--brand-hi),transparent);transform:translateX(-100%)}
@keyframes shine{0%{transform:translateX(-100%)}70%,100%{transform:translateX(100%)}}
.s.ended .segs i.done::after{background:var(--text-3)}
.segs i.skipped{background:var(--line)}
/* 长清单的整条进度 */
.pbar{position:relative;display:block;height:3px;border-radius:2px;background:var(--line-strong);overflow:hidden}
.pbar i{position:absolute;top:0;bottom:0;left:0;border-radius:2px}
.pb-d{background:linear-gradient(90deg,var(--brand-lo),var(--brand));transition:width 380ms var(--ease-out)}
.pb-n{background:color-mix(in srgb,var(--brand) 38%,transparent);overflow:hidden;transition:left 380ms var(--ease-out)}
.pb-n.live::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--brand-hi),transparent);
  transform:translateX(-100%)}
.pbar.blocked .pb-n{background:var(--red)}
/* 长清单折叠行：和条目同一列对齐 */
.it-fold{display:flex;align-items:center;gap:8px;width:100%;height:24px;margin:1px 0;padding:0;border-radius:var(--r-sm);font-size:12px;color:var(--text-4);text-align:left;
  transition:color var(--t-hover) var(--ease)}
.it-fold:hover{color:var(--text-2)}
.it-fold-ic{display:grid;place-items:center;width:14px;height:14px;flex-shrink:0}
.it-fold-ic.ok{opacity:.55}
.it-fold-ic .chev{transform:rotate(90deg)}
.it-fold-ic.up .chev{transform:rotate(-90deg)}
.segs i.blocked::after{transform:none;background:var(--red)}
.ring-v{transition:stroke-dasharray 380ms var(--ease-out)}
[data-roll]{display:inline-block}
/* 正在做的那一步：文字本身不动，上面扫过一道很淡的光（只动 transform，不重绘），每 3.2 秒一次 */
.sweep{position:relative;color:var(--text-2)!important}
.sweep::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:translateX(-110%);will-change:transform;
}
[data-theme=light] .sweep::after{background:linear-gradient(90deg,transparent,rgba(94,106,210,.16),transparent)}
@keyframes shineText{0%{transform:translateX(-110%)}55%,100%{transform:translateX(330%)}}
@keyframes sweep{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes sweepbg{from{background-position:100% 0}to{background-position:-100% 0}}
/* 看不见时（收到托盘、全屏让开、浏览器标签在后台、收成标签且没在跑）：所有循环动画暂停 */
[data-idle] *,[data-idle] *::after,[data-idle] *::before{animation-play-state:paused!important}
/* 进行中的点阵：九个点按对角线（x+y = 0…4）依次点亮，像一道光斜着扫过去。
   steps 动画只在跳变时重绘，比连续的渐变流光省得多；窗口隐藏时整体暂停（[data-idle]） */
/* 不用 CSS 动画：页面每 140ms 给每个点阵图标改一次 data-ph（见 setIdle），只有这些小点跳一下，
   其余时间不出帧。阶段 0…4 依次点亮一条对角线，5、6 停一拍 */
.dmx circle{opacity:.3}
.dmx[data-ph="0"] .dm0,.dmx[data-ph="1"] .dm1,.dmx[data-ph="2"] .dm2,.dmx[data-ph="3"] .dm3,.dmx[data-ph="4"] .dm4{opacity:1}
.dmx[data-ph="1"] .dm0,.dmx[data-ph="2"] .dm1,.dmx[data-ph="3"] .dm2,.dmx[data-ph="4"] .dm3,.dmx[data-ph="5"] .dm4{opacity:.6}
/* 光环：还在等人的图标（等你 / 受阻）和没看的通知，图标本身不动，外面一圈细光从轮廓往外扩散、淡掉，
   停一会儿再来一次，像在轻轻叫你。和“进行中”的点阵区分开：点阵是在干活，光环是在等人。
   steps 每秒只更新约 10 次，扩散完的后半段完全透明；看不见时随 [data-idle] 暂停 */
.ic .rp{opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
.ic.br,.n-row:not(.read)>.ic,.pv-row>.ic{overflow:visible}
.ic.br .rp,.n-row:not(.read)>.ic .rp,.pv-row>.ic .rp{animation:ripple 2.8s steps(28) infinite}
@keyframes ripple{0%{transform:scale(1);opacity:.75}45%{transform:scale(1.75);opacity:0}100%{transform:scale(1.75);opacity:0}}
/* 托盘预览里一排都是未读：依次错开，不一起闪 */
.pv-row:nth-child(2)>.ic .rp{animation-delay:.35s} .pv-row:nth-child(3)>.ic .rp{animation-delay:.7s}
.pv-row:nth-child(4)>.ic .rp{animation-delay:1.05s} .pv-row:nth-child(n+5)>.ic .rp{animation-delay:1.4s}
@media (prefers-reduced-motion:reduce){.ic .rp{animation:none!important}}
/* 签名动效：条目勾上时，圆点先鼓一下，对勾再描出来（这是全产品唯一的“表演”） */
/* 会话做完时只描会话自己的那个状态图标（行首 / 标签里的环），不连带清单里所有已完成条目一起重播 */
:is(.just,.celebrate>.s-head .s-l1,.mini.celebrate,.row.celebrate) > :is(.ic,svg) .ic-fill,.just .ic-fill{transform-box:fill-box;transform-origin:center;animation:pop 260ms var(--ease-out)}
:is(.just,.celebrate>.s-head .s-l1,.mini.celebrate,.row.celebrate) > :is(.ic,svg) .ic-chk,.just .ic-chk{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 320ms 90ms var(--ease-out) forwards}
@keyframes pop{from{transform:scale(.72);opacity:.4}60%{transform:scale(1.06)}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
/* 会话做完：整行亮一下再褪，一次 */
.s.celebrate,.row.celebrate{animation:glowfade 600ms var(--ease-out)}
@keyframes glowfade{from{background-color:color-mix(in srgb,var(--green) 12%,transparent)}to{background-color:transparent}}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-4);white-space:nowrap}
.conn i{width:6px;height:6px;border-radius:50%;background:var(--text-4)}
.conn.live i{background:var(--green)} .conn.lost i{background:var(--orange)}

/* ======================================================================
   悬浮窗（原生窗口 / 浏览器小窗 / 置顶小窗共用）
   ====================================================================== */
/* 外层 .f 只是一个会变形的盒子（裁切 + 背景）；里面是完整面板 .f-in 或贴边标签 .tb */
.f{display:flex;align-items:flex-start;width:100%;background:var(--bg-2);position:relative;overflow:hidden}
.f.native{width:max-content}
.f-in{flex:none;display:flex;flex-direction:column;width:340px;position:relative}
.f.pill .f-in{width:300px}
/* 收起 / 展开时旧内容的影子：叠在原位淡出，不接收鼠标 */
.f-ghost{position:absolute;top:0;left:0;z-index:5;pointer-events:none}
.f.side-right>.f-ghost{left:auto;right:0}
.f.v-bottom>.f-ghost{top:auto;bottom:0}
/* 有没看的通知：悬浮窗内沿一圈很淡的光，慢慢亮起、暗下（呼吸），打开通知或看完就停。
   只动一个元素的 opacity，并且按 steps 每秒约 10 次更新，免得毛玻璃下每帧整窗重绘吃 CPU */
.f>.breath{position:absolute;inset:0;z-index:31;pointer-events:none;border-radius:8px;opacity:.2;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bc) 70%,transparent),inset 0 0 18px -2px color-mix(in srgb,var(--bc) 45%,transparent);
  animation:breath 2.8s steps(14) infinite alternate}
@keyframes breath{to{opacity:1}}
.f.pill>.breath,.f.tucked>.breath{border-radius:inherit}
@media (prefers-reduced-motion:reduce){.f>.breath{animation:none;opacity:.7}}
.f.fill{height:100vh}
.f.fill .f-in{width:100%;height:100%}
/* 原生窗口：高度跟内容走，列表最多到 560px 再滚动 */
.f.native .f-body{max-height:560px}
.f::before{content:"";position:absolute;inset:-90px 10% auto;height:180px;pointer-events:none;z-index:0;
  background:radial-gradient(50% 50% at 50% 50%,var(--glow),transparent 70%)}
/* 标题栏下沿：内容没压在下面时不画分割线，滚动后才浮出一道柔和渐隐（Apple 滚动边缘） */
.f-top{position:relative;z-index:2;display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;flex-shrink:0;user-select:none;
  background:var(--frost);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%)}
.f-top::after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;pointer-events:none;
  background:linear-gradient(var(--bg-2),transparent);opacity:0;transition:opacity 160ms var(--ease)}
[data-scrolled="1"] .f-top::after{opacity:1}
.f-top{box-shadow:inset 0 -1px 0 var(--line-soft)}
[data-scrolled="1"] .f-top{box-shadow:inset 0 -1px 0 transparent}
.native .f-top{cursor:default}
/* Logo：深色圆角方块 + 翠绿进度环 + 白色对勾（和托盘图标同一套）。
   出现时环从 0 描到 78%；鼠标移上去环补满一圈、对勾弹一下 */
.logo{position:relative;width:18px;height:18px;border-radius:27%;flex-shrink:0;display:block;
  background:linear-gradient(135deg,#2A2D33,#0E0F11);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 1px 2px rgba(0,0,0,.35)}
[data-theme=light] .logo{box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 1px 2px rgba(0,0,0,.18)}
.logo svg{position:absolute;inset:0;width:100%;height:100%}
.logo .lg-ring{transition:stroke-dasharray 520ms var(--ease-out);animation:lgRing 700ms 120ms var(--ease-out) backwards}
@keyframes lgRing{from{stroke-dasharray:0 100}}
.logo .lg-chk{transform-origin:32px 34px;transition:transform 320ms cubic-bezier(.34,1.56,.64,1)}
@media (hover:hover) and (pointer:fine){
  :hover>.logo .lg-ring,.logo:hover .lg-ring{stroke-dasharray:100 100}
  :hover>.logo .lg-chk,.logo:hover .lg-chk{transform:scale(1.12)}
}
@media (prefers-reduced-motion:reduce){.logo .lg-ring{animation:none}}
.f-brand{color:var(--text-1);font-weight:600;letter-spacing:-.01em}
.f-cnt{font-size:12px;color:var(--text-3);white-space:nowrap;display:flex;align-items:center;gap:6px}
.f-cnt b{color:var(--text-1);font-weight:510}
.f-cnt>span{display:inline-flex;align-items:center;gap:4px}
.f-cnt .w{gap:5px}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--orange)}
.f-acts{display:flex;gap:0;margin-left:auto}
.f-body{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}

/* 通知区：等你的卡片在最上面，每屏只有它用渐变描边。用 margin 而不用 gap，收起时间距一起收 */
.n-area{padding:2px 8px 4px;display:flex;flex-direction:column}
.n-area>*{margin-bottom:6px}
.n-area>:last-child{margin-bottom:0}
.n-card{position:relative;padding:10px 12px 10px;border-radius:var(--r-lg);border:1px solid transparent;overflow:hidden;
  background:linear-gradient(var(--bg-3),var(--bg-3)) padding-box,var(--edge) border-box}
.n-card.blocked{background:linear-gradient(var(--bg-3),var(--bg-3)) padding-box,
  linear-gradient(135deg,color-mix(in srgb,var(--red) 45%,transparent),rgba(255,255,255,.04) 42%,rgba(255,255,255,.08)) border-box}
/* 新卡片进场时扫过的一道光，只扫一次（由 enter() 驱动） */
.n-glow{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:inherit;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.07) 50%,transparent 65%) 0 0/250% 100%}
[data-theme=light] .n-glow{background:linear-gradient(105deg,transparent 35%,rgba(94,106,210,.08) 50%,transparent 65%) 0 0/250% 100%}
.n-h{display:flex;align-items:center;gap:7px;color:var(--text-1);font-weight:510;font-size:12.5px;padding-right:20px}
.n-h .when{color:var(--text-4);font-weight:400;font-size:11.5px;margin-left:auto;white-space:nowrap}
.n-sub{display:flex;align-items:center;gap:6px;width:calc(100% - 21px);margin:2px 0 0 21px;padding:1px 0;color:var(--text-3);font-size:11.5px;
  border-radius:var(--r-sm);transition:color var(--t-hover) var(--ease)}
.n-sub .trunc{flex:1;min-width:0}
.n-sub:hover{color:var(--text-1)}
.n-sub .chev{color:var(--text-4);transition:transform var(--t-menu) var(--ease-out)}
.n-sub[aria-expanded="true"] .chev{transform:rotate(90deg)}
.n-list{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-menu) var(--ease-out)}
.n-list.open{grid-template-rows:1fr}
.n-list>div{overflow:hidden;min-height:0}
.n-list .pad{padding:6px 0 2px 21px;opacity:0;transition:opacity 140ms var(--ease)}
.n-list.open .pad{opacity:1;transition:opacity 200ms 60ms var(--ease)}
.n-text{margin:6px 0 0 21px;color:var(--text-1);line-height:1.55;font-size:12.5px;white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.n-acts{display:flex;gap:6px;margin:9px 0 0 21px}
.n-x{position:absolute;top:6px;right:6px;width:22px;height:22px}
.n-row{display:flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 10px;border-radius:var(--r);color:var(--text-2);font-size:12px;
  transition:background-color var(--t-hover) var(--ease)}
.n-row:hover{background:var(--hover)}
.n-row .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-row .tx b{color:var(--text-1);font-weight:510}
.n-row .when{color:var(--text-4);font-size:11.5px;white-space:nowrap}
.n-row .ib{width:22px;height:22px;opacity:0}
.n-row:hover .ib,.n-row:focus-within .ib{opacity:1}
.n-area.tight{padding-top:2px}
.g-act{font-size:11.5px;font-weight:400;color:var(--text-4);padding:1px 6px;margin-right:-6px;border-radius:var(--r);
  transition:background-color var(--t-hover) var(--ease),color var(--t-hover) var(--ease)}
.g-act:hover{color:var(--text-2);background:var(--hover)}

/* 会话列表 */
.g-h{display:flex;align-items:center;gap:6px;padding:10px 14px 4px 14px;font-size:11.5px;font-weight:600;color:var(--text-4)}
.g-h .c{font-weight:400}
.s-list{padding:0 6px 6px}
.s{border-radius:var(--r-lg);transition:background-color var(--t-hover) var(--ease)}
.s:hover{background:var(--hover)}
.s.open{background:var(--layer-1)}
.s-head{display:block;width:100%;padding:8px 8px 9px;border-radius:var(--r-lg);transition:transform var(--t-press) var(--ease-out)}
.s-head:active{transform:scale(.99)}
.s-l1{display:flex;align-items:center;gap:8px}
/* 箭头只在展开时占位，收起时宽度为 0，进度数字和下一行的耗时右边对齐 */
.s-l1 .chev{flex-shrink:0;width:0;margin-left:-8px;color:var(--text-4);opacity:0;overflow:visible;
  transition:opacity var(--t-hover) var(--ease),transform var(--t-menu) var(--ease-out),width var(--t-menu) var(--ease-out),margin var(--t-menu) var(--ease-out)}
.s.open .s-l1 .chev{width:12px;margin-left:-2px}
.s:hover .chev,.s.open .chev,.s-head:focus-visible .chev{opacity:1}
.s.open .s-l1 .chev{transform:rotate(90deg)}
/* 进度条下面垫一圈透明的命中区，鼠标好碰到；悬停时条变粗，按位置显示那一步（见 scrubber） */
.segs-wrap{display:block;margin:2px 0 -5px 22px;padding:5px 0}
.segs,.pbar{transition:height 160ms var(--ease-out)}
.segs-wrap:hover .segs,.segs-wrap:hover .pbar,.d-sec .segs:hover{height:6px}
.segs i.hov::after{background:var(--text-1)!important;transform:none}
.segs i.hov{background:var(--text-3)}
/* 进度擦洗的提示：跟着鼠标在条的上方滑动 */
.seg-tip{position:fixed;z-index:50;left:0;top:0;max-width:260px;padding:6px 9px 7px;border-radius:var(--r);pointer-events:none;
  background:var(--bg-3);box-shadow:var(--shadow-pop);font-size:11.5px;line-height:1.45;color:var(--text-2);opacity:0;
  transition:opacity 120ms var(--ease),transform 90ms var(--ease-out)}
.seg-tip.on{opacity:1}
.seg-tip b{display:flex;align-items:center;gap:6px;color:var(--text-1);font-weight:510;font-size:12px}
.seg-tip b .ic{width:12px;height:12px}
.seg-tip .st{color:var(--text-4);font-weight:400;margin-left:auto;white-space:nowrap}
.seg-tip span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-tip .nt{color:var(--text-4)}
/* 会话行悬停：右上角浮出几个快捷操作，进度数字让位 */
.s{position:relative}
.s-quick{position:absolute;top:5px;right:6px;display:flex;gap:1px;padding:1px;border-radius:var(--r);background:var(--bg-3);box-shadow:0 0 0 1px var(--line),0 4px 12px -4px rgba(0,0,0,.5);
  opacity:0;transform:translateX(6px) scale(.96);pointer-events:none;transition:opacity 140ms var(--ease),transform 180ms var(--ease-out)}
.s-quick .ib{width:24px;height:24px}
.s:hover>.s-quick,.s:focus-within>.s-quick{opacity:1;transform:none;pointer-events:auto;transition-delay:80ms}
.s:hover>.s-head .s-prog,.s:hover>.s-head .s-l1 .chev{opacity:0}
.s-prog{transition:opacity 120ms var(--ease)}
/* 条目悬停：耗时让位给“复制 / 跳过” */
.it-s{position:relative;border-radius:var(--r-sm)}
.it-s>.it-acts{position:absolute;right:-4px;top:0;display:flex;opacity:0;transform:translateX(4px);transition:opacity 120ms var(--ease),transform 160ms var(--ease-out)}
.it-s>.it-acts .ib{width:22px;height:22px}
.it-s:hover>.it-acts{opacity:1;transform:none}
.it-s:hover>.tm{opacity:0}
.it-s>.tm{transition:opacity 120ms var(--ease)}
@media (hover:none){.s-quick,.it-s>.it-acts{display:none}}
.tx-wrap{flex:1;min-width:0;display:flex;overflow:hidden}
.tx-wrap .tx{flex:1;min-width:0}
.s-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-1);font-weight:510}
.s.ended .s-title{color:var(--text-2)}
.s-prog{font-size:12px;color:var(--text-3);flex-shrink:0}
.s-l2{display:flex;align-items:center;gap:6px;margin:3px 0 0 22px;font-size:12px;color:var(--text-3)}
.s-l2 .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-l2 .tm{color:var(--text-4);flex-shrink:0}
.s-l2 .stale{color:var(--text-4);flex-shrink:0}
.s-l2 .stale.live{color:var(--text-3)} /* 对话还在动，只是没报：比“没动静”亮一点 */
.s .segs{margin:7px 0 0 22px}
.s-items{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-menu) var(--ease-out)}
.s.open .s-items{grid-template-rows:1fr}
.s-items>div{overflow:hidden;min-height:0}
.s-items .pad{padding:2px 8px 8px 30px;opacity:0;transition:opacity 140ms var(--ease)}
.s.open .s-items .pad{opacity:1;transition:opacity 200ms 60ms var(--ease)}
.it-s.sum .tx{color:var(--text-3)}
/* 子任务：挂在主会话下，左侧一条细线连起来 */
.kids{margin:-2px 8px 6px 15px;padding-left:10px;border-left:1px solid var(--line)}
.kid{border-radius:var(--r);transition:background-color var(--t-hover) var(--ease)}
.kid:hover{background:var(--hover)}
.kid-h{display:flex;align-items:center;gap:7px;width:100%;height:26px;padding:0 6px;font-size:12px;border-radius:var(--r)}
.kid-h .ic{width:12px;height:12px}
.kid-t{flex:0 1 auto;min-width:0;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2);font-weight:510}
.kid-s{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-4)}
.kid-p{color:var(--text-4);font-size:11.5px;flex-shrink:0}
.kid .s-items .pad{padding:0 6px 6px 25px}
.kid.open .s-items{grid-template-rows:1fr}
.kid.open .s-items .pad{opacity:1;transition:opacity 200ms 60ms var(--ease)}
.it-s{display:flex;align-items:flex-start;gap:8px;padding:3px 0;font-size:12px;color:var(--text-2)}
.it-s .ic{margin-top:2px}
.it-s .tx{flex:1;min-width:0;line-height:18px;word-break:break-word}
.it-s .nt{display:block;color:var(--text-4);font-size:11.5px;line-height:16px;margin-top:1px}
.it-s.done .tx{color:var(--text-3)}
.it-s.skipped .tx{color:var(--text-4);text-decoration:line-through}
.it-s .tm{color:var(--text-4);font-size:11.5px;line-height:18px;white-space:nowrap}
.it-s.doing .tm{color:var(--text-2)}
.s-more{display:flex;align-items:center;gap:2px;margin:6px 0 0 -9px} /* 左移按钮内边距，图标和上面条目的勾对齐 */
.s-more .btn{color:var(--text-3)}
.s-more .btn:hover{color:var(--text-1)}
/* 清单里的模块段标题：小号灰字 + 这一段的进度，勾完变绿；第一段上面不留空 */
.it-g{display:flex;align-items:center;gap:8px;margin:10px 0 2px;padding:0 2px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--text-3);list-style:none}
.it-g:first-child{margin-top:2px}
.it-g .num{margin-left:auto;font-weight:500;color:var(--text-4)}
.it-g.ok .num{color:var(--green)}
.it-g::after{content:"";order:1;flex:1;height:1px;background:var(--line-soft)}
.it-g.sep{margin:8px 0 4px;height:1px;gap:0}
.it-g.sep::after{margin:0}
.it-g .num{order:2;margin-left:0}
.checklist .it-g{margin:14px 0 4px;padding:0 12px;font-size:11.5px}
.checklist .it-g:first-child{margin-top:4px}
.cd-list li.it-g{display:flex;padding:8px 0 2px;font-size:11px;color:var(--text-3)}
.f-empty{padding:22px 20px 22px;text-align:center;color:var(--text-3);line-height:1.65}
.f-empty b{display:block;color:var(--text-1);font-weight:510;margin-bottom:2px}
/* 空状态小插画：线条先画出来，对勾再一笔一笔描上，只在出现时放一次 */
.e-art{display:block;margin:0 auto 10px}
.e-art .e-l{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 520ms 120ms var(--ease-out) forwards}
.e-art .e-c{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 360ms 480ms var(--ease-out) forwards}
.f-empty .acts{display:flex;justify-content:center;gap:6px;margin-top:12px}

/* ============ 贴边小标签 ============
   收起后窗口缩成一个 30px 宽的竖排标签，紧贴屏幕边（鼠标甩到边上就能碰到）。
   内容：✓ 标志 + 每个活跃会话一个小进度环；有新消息时横向长成气泡。 */
.f.tucked{background:var(--bg-2)}
.f.tucked::before{display:none}
[data-dock=right] .f.native{justify-content:flex-end} /* 变形时内容贴着屏幕边，从边上长出来 */
.tb{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;width:30px;padding:7px 0 8px;cursor:pointer;user-select:none}
:is([data-dock=top],[data-dock=bottom]) .tb{flex-direction:row;width:auto;height:30px;padding:0 9px 0 7px}
[data-dock=bottom] .f.native.tucked{align-items:flex-end}
/* 细条：8px 粗，每个任务一段；横贴（上 / 下）时横着，竖贴（左 / 右）时竖着 */
.tb.strip{gap:8px;padding:0;width:auto;height:auto;cursor:pointer}
.sb{display:flex;flex-direction:column;gap:2px;padding:2px;width:8px;height:calc(var(--n) * 34px + 4px);max-height:300px;border-radius:4px;background:var(--bg-2)}
:is([data-dock=top],[data-dock=bottom]) .sb{flex-direction:row;width:calc(var(--n) * 44px + 4px);max-width:360px;height:8px}
.sb-g{flex:1;border-radius:2px;background:linear-gradient(to bottom,var(--c) var(--p),color-mix(in srgb,var(--c) 26%,transparent) var(--p));transition:filter 160ms var(--ease)}
:is([data-dock=top],[data-dock=bottom]) .sb-g{background:linear-gradient(to right,var(--c) var(--p),color-mix(in srgb,var(--c) 26%,transparent) var(--p))}
.sb-g.idle{background:var(--line-strong)}
.sb-g.w{animation:sbW 1.4s ease-in-out infinite}
@keyframes sbW{50%{filter:brightness(1.5)}}
.strip.open .sb-g:not(.on){filter:saturate(.5) brightness(.75)}
/* 进度卡：贴在细条朝屏幕里的那一侧 */
.tb.strip.open{align-items:flex-start;padding:8px}
[data-dock=right] .tb.strip.open{flex-direction:row-reverse}
[data-dock=top] .tb.strip.open{flex-direction:column}
[data-dock=bottom] .tb.strip.open{flex-direction:column-reverse}
.sc{display:flex;flex-direction:column;gap:4px;width:250px;padding:2px 2px 0}
.sc-h{display:flex;align-items:center;gap:7px}
.sc-h b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-1);font-weight:560;font-size:12.5px}
.sc-h .num{color:var(--text-3);font-size:11.5px}
.sc-s{position:relative;overflow:hidden;color:var(--text-2);font-size:12px;white-space:nowrap;text-overflow:ellipsis}
.sc .segs{margin:3px 0 1px}
.sc-m{display:flex;align-items:center;gap:6px;color:var(--text-4);font-size:11px;white-space:nowrap}
.sc-m .tile.sm{width:14px;height:14px;font-size:7.5px;border-radius:4px}
.sc-m .dot{width:2px;height:2px;border-radius:50%;background:currentColor;opacity:.7}
@media (prefers-reduced-motion:reduce){.sb-g.w{animation:none}}
.tb .logo{width:16px;height:16px;border-radius:4px}
.tb-sep{width:12px;height:1px;background:var(--line)}
:is([data-dock=top],[data-dock=bottom]) .tb-sep{width:1px;height:12px}
.tb-more{font-size:10px;font-weight:600;color:var(--text-3);line-height:1}
/* 有人等你：标签贴屏幕的那条边亮一道橙线 */
.f.hot::after{content:"";position:absolute;background:var(--orange);border-radius:2px;pointer-events:none}
[data-dock=right] .f.hot::after{right:0;top:9px;bottom:9px;width:2px}
[data-dock=left] .f.hot::after{left:0;top:9px;bottom:9px;width:2px}
[data-dock=top] .f.hot::after{top:0;left:9px;right:9px;height:2px}
[data-dock=bottom] .f.hot::after{bottom:0;left:9px;right:9px;height:2px}
.f.hot:has(.strip)::after{display:none} /* 细条自己会让等你的那段闪 */
/* 勿扰中：标题栏一个月亮，点它结束 */
.ib.dnd-on{color:var(--text-2);margin-left:-2px}
/* 归档后的撤销条 */
.undo{display:flex;align-items:center;gap:8px;margin:2px 8px 8px;padding:6px 6px 6px 12px;border-radius:var(--r-lg);
  background:var(--layer-2);border:1px solid var(--line);font-size:12px;color:var(--text-2)}
.undo span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo .g-act{margin-right:0;color:var(--text-1);flex-shrink:0;white-space:nowrap}
/* 小进度环：可以点，点了打开那个会话 */
.mini{cursor:pointer;transition:transform var(--t-press) var(--ease-out)}
.mini:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){.mini:hover .m-track{stroke:var(--text-4)}}
/* 小进度环 */
.mini{display:block;width:18px;height:18px;border-radius:50%}
.mini svg{display:block;overflow:visible}
.m-track{fill:none;stroke:var(--line-strong);stroke-width:2}
.mini.planning .m-track{stroke-dasharray:2 2.4}
.m-arc{fill:none;stroke:var(--text-2);stroke-width:2;stroke-linecap:round;transition:stroke-dasharray 380ms var(--ease-out),stroke 200ms var(--ease)}
.m-c{fill:var(--text-3)}
.mini.running .m-c{fill:var(--text-1)}
.mini.waiting .m-arc,.mini.waiting .m-c{stroke:var(--orange);fill:var(--orange)}
.mini.waiting .m-arc{fill:none}
.mini.blocked .m-arc{stroke:var(--red)}
.mini.blocked .m-c{fill:var(--red)}
.m-x{stroke:var(--red);stroke-width:1.6;stroke-linecap:round}
/* 正在跑：环上有一小段高光在转（只有“进行中”才循环，同屏最多 3 处） */
.m-orbit{fill:none;stroke:var(--text-1);stroke-width:2;stroke-linecap:round;transform-origin:9px 9px}
@keyframes orbit{to{transform:rotate(360deg)}}
/* 消息气泡：标签横向长出来，图标 + 谁 + 一句话 */
.tb.speak{flex-direction:row;align-items:flex-start;gap:8px;width:max-content;max-width:256px;padding:9px 12px 10px 10px}
:is([data-dock=top],[data-dock=bottom]) .tb.speak{height:auto}
.tb.speak .ic{margin-top:2px}
.tb-tx{display:flex;flex-direction:column;min-width:0;max-width:212px;font-size:12px;line-height:1.45}
.tb-tx b{color:var(--text-1);font-weight:510;white-space:nowrap}
.tb-tx span{color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

/* 胶囊：收起后只剩一行，显示最要紧的那件事 */
.f.pill .f-body,.f.pill .f-cnt{display:none}
.f.pill .f-top{border-bottom:0;height:44px;padding-left:10px}
.f.pill::before{display:none}
.pill-tx{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2)}
.pill-tx .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-tx b{color:var(--text-1);font-weight:510}
.pill-tx .p{color:var(--text-3);font-size:12px;flex-shrink:0}
/* 轮换位置：几个点，当前这个亮一点（最多 6 个） */
.pill-dots{display:flex;gap:3px;flex-shrink:0}
.pill-dots i{width:4px;height:4px;border-radius:50%;background:var(--text-4);opacity:.6}
.pill-dots i.on{background:var(--text-2);opacity:1}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--orange);color:#08090A;font-size:11px;font-weight:600}

/* ============ 铃铛 + 通知抽屉 ============
   抽屉在朝屏幕中间的那一侧拉开：靠右的窗口往左长（右边缘不动），所以内容要贴着右边，
   变形时主面板不动、抽屉从它背后滑出来；收起时主面板也不跳。 */
.f.native.side-right{justify-content:flex-end}
[data-dock=left] .f.native,[data-dock=top] .f.native{justify-content:flex-start}
.bell{position:relative}
.bell-ic{transform-origin:50% 15%}
.bell.on{background:var(--active);color:var(--text-1)}
.bell.unread{color:var(--text-1)}
/* 未读角标用主题绿（Tick 的颜色）；有人在等你时铃铛本身变橙 */
.bell .bdg{position:absolute;top:1px;right:0;min-width:14px;height:14px;padding:0 3px;border-radius:7px;display:grid;place-items:center;
  background:var(--brand);box-shadow:0 0 0 1.5px var(--bg-2);color:#06130C;font-size:9px;font-weight:700;line-height:1}
.bell.hot{color:var(--orange)}
/* 抽屉盖在整个窗口上，从铃铛的位置展开；窗口不变宽，内容太矮时长高给抽屉留地方 */
.f.drawer .f-in{min-height:420px}
.f-drawer{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;background:var(--bg-2);
  transform-origin:calc(100% - 96px) 20px;animation:drIn 260ms var(--ease-drawer) backwards}
@keyframes drIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.f.fill .f-drawer{box-shadow:var(--shadow-pop)}

.s.dead .s-title{color:var(--text-2)}
.s-why{display:block;margin:4px 0 0 22px;font-size:11.5px;line-height:1.45;color:var(--text-4)}
.s-why b{color:var(--text-3);font-weight:560}
.g-h>.g-peek{flex:1 1 auto;min-width:0;font-weight:400;color:var(--text-4)}
.hist:not(.open) .g-h{padding-bottom:10px}
.g-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-panel) var(--ease-out)}
.hist.open .g-body{grid-template-rows:1fr}
.g-body>div{overflow:hidden;min-height:0}
.g-body .s-list{opacity:0;transition:opacity 140ms var(--ease)}
.hist.open .g-body .s-list{opacity:1;transition:opacity 220ms 90ms var(--ease)}

/* 左上角 logo：点开 Agent 面板。悬停时浮起一圈底，按下缩一下；断线时右下角一个橙点 */
.f-logo{position:relative;display:grid;place-items:center;width:28px;height:28px;margin:0 -5px;border-radius:8px;flex-shrink:0;
  transition:background-color var(--t-hover) var(--ease),transform var(--t-press) var(--ease)}
.f-logo:hover,.f-logo.on{background:var(--hover)}
.f-logo:active{transform:scale(.9)}
.f-logo.lost::after{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 1.5px var(--bg-2)}
/* Agent 面板：和通知抽屉同一个壳，从 logo 那里展开 */
.f.sheet .f-in{min-height:360px}
.f-agents{transform-origin:22px 22px}
.f-agents .dr-top .conn{font-size:11.5px}
.ag-list{display:flex;flex-direction:column;padding:6px}
.ag-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-lg);text-align:left;
  transition:background-color var(--t-hover) var(--ease)}
.ag-row:hover{background:var(--hover)}
.ag-row:active{background:var(--active)}
.ag-row .tile{width:26px;height:26px;border-radius:7px;font-size:10.5px;color:var(--ac);
  background:color-mix(in srgb,var(--ac) 14%,transparent);border-color:color-mix(in srgb,var(--ac) 28%,transparent)}
.ag-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ag-n{display:flex;align-items:center;gap:6px;min-width:0}
.ag-n b{font-weight:510;color:var(--text-1);font-size:13px}
.ag-w,.ag-r{flex-shrink:0;font-size:11px;padding:0 6px;height:16px;line-height:16px;border-radius:8px}
.ag-w{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
.ag-r{color:var(--brand-hi);background:color-mix(in srgb,var(--brand) 14%,transparent)}
.ag-e{font-size:12px;color:var(--text-3)}
.ag-row .when{flex-shrink:0;align-self:flex-start;margin-top:2px;font-size:11.5px;color:var(--text-4)}
.f-agents .dr-foot .btn{height:28px}

/* ============ 胶囊悬停：环形任务列表 ============
   横条在鼠标下面缩成一个圆（圆心钉在鼠标处，窗口围着它长出来，不挪位置），
   任务从圆心弹出去，上下等距、横向沿圆弧排开：每个任务一枚带进度环的小圆，外侧一张横放的信息卡。
   展开时窗口透明（宿主关掉 Acrylic、圆角和边框，见 tickClear），圆和卡片自己是实底、带投影；
   四周留 28px，投影和悬停光圈不会被窗口边裁掉 */
.f.native.pill.v-bottom{align-items:flex-end}
.f.native.pill.side-right{justify-content:flex-end}
[data-glass] .f.fanning{background:transparent;box-shadow:none}
[data-glass] .f.fanning::before{display:none}
html:not([data-glass]) .f.fanning{background:var(--bg-2)}
.f.fanning .f-in{width:auto}
.fan{--spring:cubic-bezier(.34,1.56,.64,1);--lift:0 10px 28px -12px rgba(0,0,0,.75),0 2px 6px -2px rgba(0,0,0,.4);position:relative;flex:none}
.fan-at{position:absolute;width:0;height:0;pointer-events:none}
/* 圆心：总进度环 + 进行中个数；点一下展开悬浮窗 */
.fh{position:absolute;z-index:4;display:grid;place-items:center;width:56px;height:56px;border-radius:28px;cursor:pointer;
  background:var(--bg-3);box-shadow:0 0 0 1px var(--line-strong),var(--lift);transition:box-shadow 200ms var(--ease),scale 260ms var(--spring)}
.fh:hover,.fh:focus-visible{outline:none;scale:1.06;box-shadow:0 0 0 1px color-mix(in srgb,var(--brand) 55%,transparent),0 0 0 6px color-mix(in srgb,var(--brand) 14%,transparent),var(--lift)}
.fh:active{scale:.96}
.fh>*{animation:fade 180ms 300ms var(--ease) backwards}
/* 只管圆心自己的直接子元素：变形时按钮里会放一份横条副本，别把副本里的图标、文字也改了 */
.fh>svg{position:absolute;inset:0}
.fh>b{position:relative;font-size:17px;font-weight:650;color:var(--text-1);letter-spacing:-.02em}
.fh>.wd{position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2.5px var(--bg-3)}
@keyframes fade{from{opacity:0}}
/* 一个任务 = 连线 + 小圆 + 信息卡，放在同一个零尺寸的组里，悬停任何一个三者一起亮 */
.fg{position:absolute;left:0;top:0;width:0;height:0}
.fg-l{position:absolute;height:1px;transform-origin:0 50%;pointer-events:none;opacity:.7;
  background:linear-gradient(90deg,transparent 30px,var(--line-strong) 30px,var(--line-strong) calc(100% - 18px),transparent calc(100% - 18px));
  animation:lnIn 300ms var(--ease-out) backwards;animation-delay:calc(var(--i) * 34ms + 200ms);transition:opacity 160ms var(--ease)}
@keyframes lnIn{from{scale:0 1}}
.fs{position:absolute;z-index:3;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:color-mix(in srgb,var(--ag,#8A8F98) 18%,var(--bg-3));box-shadow:0 0 0 1px var(--line),var(--lift);
  animation:fsIn 520ms var(--spring) backwards;animation-delay:calc(var(--i) * 34ms + 180ms);
  transition:transform 240ms var(--spring),box-shadow 180ms var(--ease),opacity 160ms var(--ease),filter 160ms var(--ease)}
@keyframes fsIn{from{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.fs svg{position:absolute;inset:0;overflow:visible}
.fs-tr{fill:none;stroke:var(--line-strong);stroke-width:2}
.fs-arc{fill:none;stroke:var(--sc);stroke-width:2.4;stroke-linecap:round;transition:stroke-dasharray 400ms var(--ease-out)}
.fs-m{position:relative;font-size:10px;font-weight:650;color:var(--text-1)}
.fs-dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--bg-3)}
/* 信息卡：三行（标题 + 进度 / 正在做的一步 / agent · 状态 · 用时），宽度跟内容走 */
.fc{position:absolute;z-index:2;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-content:center;column-gap:7px;row-gap:3px;
  width:max-content;min-width:168px;max-width:236px;height:58px;padding:0 12px 0 11px;border-radius:12px;text-align:left;cursor:pointer;
  background:var(--bg-3);box-shadow:0 0 0 1px var(--line),var(--lift);
  animation:fcIn 380ms var(--ease-out) backwards;animation-delay:calc(var(--i) * 34ms + 290ms);
  transition:transform 220ms var(--spring),box-shadow 180ms var(--ease),opacity 160ms var(--ease),background-color 160ms var(--ease),filter 160ms var(--ease)}
@keyframes fcIn{from{opacity:0;transform:translateX(var(--kx))}}
.fc>.ic{grid-row:1;align-self:center}
.fc-t{grid-row:1;color:var(--text-1);font-weight:560;font-size:12.5px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-p{grid-row:1;color:var(--text-3);font-size:11.5px;line-height:16px}
.fc-s,.fc-m{grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:15px}
.fc-s{color:var(--text-2);font-size:11.5px}
.fc-m{display:flex;align-items:center;gap:6px;color:var(--text-4);font-size:11px}
.fc-m .tile.sm{width:14px;height:14px;font-size:7.5px;border-radius:4px;flex-shrink:0}
.fc-m .dot{width:2px;height:2px;border-radius:50%;background:currentColor;opacity:.7;flex-shrink:0}
.fc.solo{grid-template-columns:minmax(0,1fr)}
.fg.st-waiting .fc,.fg.st-blocked .fc{box-shadow:0 0 0 1px color-mix(in srgb,var(--sc) 50%,transparent),var(--lift)}
.fg.st-waiting .fc-s,.fg.st-blocked .fc-s{color:var(--text-1)}
.fg.more .fs-m{color:var(--text-2)}
/* 悬停 / 键盘焦点：这一组往外探一点，连线换成状态色，其余退后 */
/* 退后用压暗而不是半透明：窗口是透明的，半透明会把后面的桌面透出来 */
.fan:has(.fg:hover,.fg:focus-within) .fg:not(:hover,:focus-within) :is(.fs,.fc){filter:brightness(.62) saturate(.6)}
.fan:has(.fg:hover,.fg:focus-within) .fg:not(:hover,:focus-within) .fg-l{opacity:.35}
.fg:is(:hover,:focus-within) .fg-l{opacity:1;background:linear-gradient(90deg,transparent 30px,var(--sc) 30px,var(--sc) calc(100% - 18px),transparent calc(100% - 18px))}
.fg:is(:hover,:focus-within) .fs{transform:scale(1.12);box-shadow:0 0 0 1px var(--line-strong),0 0 0 5px color-mix(in srgb,var(--sc) 20%,transparent),var(--lift)}
.fg:is(:hover,:focus-within) .fc{transform:translateX(var(--nudge));background:var(--layer-3,var(--bg-3));box-shadow:0 0 0 1px var(--line-strong),var(--lift)}
.fg .fs:focus-visible,.fg .fc:focus-visible{outline:none}
.fg:has(.fs:focus-visible) .fc{box-shadow:0 0 0 1.5px var(--sc),var(--lift)}
.fg :is(.fs,.fc):active{scale:.97}
@media (hover:hover) and (pointer:fine){
  /* 贴边标签里的小环也一样：停上去弹一下，邻居跟着动 */
  .tb .mini{transition:transform 260ms cubic-bezier(.34,1.56,.64,1)}
  .tb .mini:hover{transform:scale(1.34)}
  .tb .mini:hover + .mini,.tb .mini:has(+ .mini:hover){transform:scale(1.12)}
}
/* 收起：卡片先淡掉，小圆收回圆心，连线缩回 */
.fan.closing .fc{opacity:0;transition:opacity 100ms var(--ease)}
.fan.closing .fs{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0;transition:transform 200ms ease-in,opacity 180ms var(--ease);transition-delay:calc((8 - var(--i)) * 10ms)}
.fan.closing .fg-l{scale:0 1;transition:scale 160ms ease-in}
.fan.closing .fh>*{opacity:0;transition:opacity 120ms var(--ease)}
/* 窗口换尺寸前的一瞬：只露出扮成横条的圆心按钮，其余的入场动画先停着，窗口到位后一起开始 */
.fan.hold>:not(.fh){visibility:hidden}
.fan.hold *{animation-play-state:paused!important}
/* 横条和圆心互变时：按钮裁掉横条上的文字，悬停放大先关掉（不然横条一出来就大一圈） */
.fh.morph{overflow:hidden;scale:none!important;transition:none}
.fh>.fh-ghost{position:absolute;left:0;top:0;animation:none;pointer-events:none}
@media (prefers-reduced-motion:reduce){.fs,.fc,.fg-l,.fh>*,.f-drawer{animation:none}.fs,.fc,.tb .mini{transition:opacity 120ms linear}}

/* ======================================================================
   面板（浏览器里看历史与详情）
   ====================================================================== */
.app{display:flex;height:100vh}
.side{width:224px;flex-shrink:0;display:flex;flex-direction:column;padding:10px 8px 10px 10px}
.brand{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px;color:var(--text-1);font-weight:600}
.brand .logo{width:20px;height:20px}
nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;margin-top:10px}
.nav-h{height:28px;display:flex;align-items:center;padding:0 8px;margin-top:12px;font-size:11.5px;font-weight:600;color:var(--text-4)}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;height:28px;padding:0 8px;border-radius:var(--r);color:var(--text-3);font-weight:510;
  transition:background-color var(--t-hover) var(--ease),color var(--t-hover) var(--ease)}
.nav-i:hover{background:var(--hover);color:var(--text-2)}
.nav-i.on{background:var(--active);color:var(--text-1)}
.nav-i .cnt{font-size:11.5px;color:var(--text-4);font-weight:400}
.nav-i .cnt:empty{display:none}
.nav-i .cnt.hot{display:inline-flex;align-items:center;gap:5px;color:var(--text-1)}
.nav-i .cnt.hot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange)}
.nav-i .dot{margin:0 5px}
.side-foot{border-top:1px solid var(--line-soft);padding-top:8px;display:flex;flex-direction:column;gap:1px}
.main{flex:1;min-width:0;display:flex;padding:8px 8px 8px 0}
.panel{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-xl);
  background:var(--bg-2);box-shadow:inset 0 1px 0 var(--hi);overflow:hidden}
.panel::before{content:"";position:absolute;inset:-140px 15% auto;height:280px;pointer-events:none;z-index:0;
  background:radial-gradient(50% 50% at 50% 50%,var(--glow),transparent 70%)}
.top{position:relative;z-index:3;display:flex;align-items:center;gap:10px;height:46px;padding:0 10px 0 16px;flex-shrink:0;
  border-bottom:1px solid var(--line-soft);background:var(--frost);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%)}
.crumb{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.crumb b{color:var(--text-1);font-weight:510}
.today{font-size:12px;color:var(--text-4);white-space:nowrap}
.body{position:relative;z-index:1;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.body.split{grid-template-columns:minmax(0,1fr) minmax(420px,46%)}
.list{overflow:auto;min-width:0}
.group-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:32px;padding:0 16px;
  background:color-mix(in srgb,var(--bg-2) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);color:var(--text-1);font-weight:510;font-size:12.5px}
.group-h .cnt{color:var(--text-4);font-weight:400}
.group-h .g-note{margin-left:auto;color:var(--text-4);font-weight:400;font-size:12px}
.row.dormant .title{color:var(--text-3)}
/* 顶栏搜索：平时是一个安静的输入框，聚焦时亮起焦点环 */
.search{display:flex;align-items:center;gap:7px;width:min(320px,40vw);height:28px;margin-left:8px;padding:0 6px 0 9px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--layer-1);color:var(--text-4);transition:border-color var(--t-hover) var(--ease),background-color var(--t-hover) var(--ease)}
.search:focus-within{border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:var(--layer-2);box-shadow:0 0 0 3px var(--accent-soft);color:var(--text-2)}
.search input{flex:1;min-width:0;font:inherit;font-size:12.5px;color:var(--text-1);background:none;border:0;outline:none}
.search input::placeholder{color:var(--text-4)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within kbd{display:none}
.top-r{display:flex;align-items:center;gap:10px}
/* 原生面板没有系统标题栏：顶栏和侧栏品牌行就是拖动区，右上角是窗口按钮 */
[data-win] .top,[data-win] .brand{user-select:none;-webkit-user-select:none}
.wc{display:flex;align-items:center;gap:2px;margin-left:2px;padding-left:8px;border-left:1px solid var(--line-soft);height:20px}
.wc .ib{width:30px;height:28px}
.wc .ib svg{transition:transform var(--t-press) var(--ease-out)}
.wc .ib:active svg{transform:scale(.88)}
.wc-x:hover{background:#e5484d;color:#fff}
[data-act="win-max"] svg+svg,[data-max] [data-act="win-max"] svg:first-child{display:none}
[data-max] [data-act="win-max"] svg+svg{display:block}
.row{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;
  transition:background-color var(--t-hover) var(--ease)}
.row:hover{background:var(--hover)}
.row.sel{background:var(--active);box-shadow:inset 2px 0 0 var(--accent)}
.row .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-1);font-weight:510}
.row .title .sub{color:var(--text-4);font-weight:400;margin-left:8px}
.row .prog{display:flex;align-items:center;justify-content:flex-end;gap:6px;width:62px;color:var(--text-3);font-size:12px;flex-shrink:0}
.row .time{width:56px;text-align:right;color:var(--text-4);font-size:12px;flex-shrink:0}
.detail{min-width:0;overflow:auto;border-left:1px solid var(--line-soft);background:var(--layer-1)}
.detail.in{animation:drawer var(--t-panel) var(--ease-drawer)}
@keyframes drawer{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.d-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 20px;
  background:color-mix(in srgb,var(--bg-2) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.d-main{padding:20px 28px 48px;max-width:780px}
.d-status{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:12px;font-weight:510}
.d-title{margin:8px 0 6px;font-size:20px;line-height:1.4;font-weight:510;color:var(--text-1);letter-spacing:-.01em}
.d-goal{color:var(--text-2);line-height:1.65}
.callout{margin-top:16px;padding:12px 14px;border-radius:var(--r-lg);border:1px solid transparent;
  background:linear-gradient(var(--bg-3),var(--bg-3)) padding-box,var(--edge) border-box}
.callout .c-h{display:flex;align-items:center;gap:8px;color:var(--text-1);font-weight:510}
.callout .c-b{margin:6px 0 10px 22px;color:var(--text-2);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.callout .c-a{display:flex;gap:8px;margin-left:22px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:0 16px;margin-top:16px;padding:6px 14px;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--layer-1)}
.facts dt{color:var(--text-3);font-size:12px;line-height:28px}
.facts dd{color:var(--text-2);line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-sec{margin-top:24px}
.d-sec h3{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:510;color:var(--text-3)}
.d-sec .segs{height:4px;margin-bottom:10px}
.checklist{list-style:none;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--layer-1);overflow:hidden}
.it{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line-soft)}
.it:last-child{border-bottom:0}
.it .ic{margin-top:3px}
.it .n{width:16px;text-align:right;color:var(--text-4);font-size:12px;line-height:20px;flex-shrink:0}
.it-body{flex:1;min-width:0}
.it-text{color:var(--text-1);line-height:20px;word-break:break-word}
.it.todo .it-text,.it.done .it-text{color:var(--text-2)}
.it.skipped .it-text{color:var(--text-4);text-decoration:line-through}
.it-note{margin-top:2px;color:var(--text-3);font-size:12px;line-height:1.55;word-break:break-word}
.it-time{color:var(--text-4);font-size:12px;line-height:20px;white-space:nowrap}
.it.doing{background:var(--layer-2)}
.it.doing .it-time{color:var(--text-2)}
/* 增删改 */
.it-tick{display:grid;place-items:center;width:18px;height:18px;margin:1px -2px 0;border-radius:50%;flex-shrink:0;
  transition:background-color var(--t-hover) var(--ease),transform var(--t-press) var(--ease-out)}
.it-tick:hover{background:var(--hover)}
.it-tick:active{transform:scale(.92)}
.it .it-tick .ic,.it-s .it-tick .ic{margin:0}
.it-acts{display:flex;gap:2px;opacity:0;transition:opacity var(--t-hover) var(--ease)}
.it:hover .it-acts,.it:focus-within .it-acts{opacity:1}
.ib.sm{width:22px;height:22px}
.it-in,.d-title-in{width:100%;font:inherit;color:var(--text-1);background:var(--layer-2);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);

function ingest(s) {
  const prev = S.sessions.get(s.id);
  S.sessions.set(s.id, s);
  if (!prev || !S.ready) return;
  s.items.forEach((it, i) => {
    const old = prev.items.find(x => x.id === it.id);
    if (old && old.status !== 'done' && it.status === 'done') {
      const k = `${s.id}:${it.id}`;
      S.justDone.add(k);
      setTimeout(() => S.justDone.delete(k), 1500);
      // 勾了一项：右下角弹提醒卡。最后一项紧跟着会有“做完了”，那张会替换它
      sendToast(toastCard(s, 'item', { index: i + 1, text: it.note ? `${it.text} · ${it.note}` : it.text }));
    }
  });
  // 会话做完：状态图标描勾、整行亮一下，只在真正做完的那一刻
  if (prev.status !== 'done' && s.status === 'done') {
    S.celebrate.add(s.id);
    setTimeout(() => { S.celebrate.delete(s.id); schedule(); }, 1600);
  }
}
function ingestNotice(n) {
  const k = S.notices.findIndex(x => x.id === n.id);
  if (k >= 0) { S.notices[k] = n; return; }
  S.notices.unshift(n);
  if (!n.read && S.ready) {
    announce(n);
    const s = S.sessions.get(n.sessionId);
    sendToast(toastCard(s, n.kind, { agentId: n.agent, text: n.kind === 'done' || n.kind === 'failed' ? (s?.summary || n.text || n.title) : n.text, sub: s?.title || n.title || '' }));
    noticeGlow(n.kind);
    if (NATIVE && S.dock.tucked) speakFor(n);
    if (FLOAT && (n.kind === 'waiting' || n.kind === 'blocked')) { S.drawerWant = true; S.pillSid = n.sessionId; } // 胶囊先换到提问的那个
    // 铃铛摆一下（画完这一帧之后）。用 WAAPI，不靠 class：重绘会按新 HTML 改掉 class
    if (FLOAT && !RM.matches) {
      setTimeout(() => {
        const ic = (pip.root || root).querySelector('.bell .bell-ic');
        ic?.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(16deg)' }, { transform: 'rotate(-12deg)' }, { transform: 'rotate(7deg)' }, { transform: 'rotate(-3deg)' }, { transform: 'rotate(0)' }],
          { duration: 620, easing: 'ease-out' });
        ic?.querySelector('.bell-clap')?.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-1.2px)' }, { transform: 'translateX(1px)' }, { transform: 'translateX(0)' }], { duration: 520, delay: 60 });
      }, 30);
    }
  }
}
async function connect() {
  if (qs.has('demo') || !HTTP) return startDemo();
  try {
    const h = await (await fetch('/api/health')).json();
    S.desktop = !!h.desktop;
    S.info = h;
  } catch {
    return startDemo();
  }
  await reload();
  const es = new EventSource('/api/stream');
  es.addEventListener('hello', () => { if (S.conn === 'lost') reload(); S.conn = 'live'; schedule(); });
  es.addEventListener('session', e => { ingest(JSON.parse(e.data)); scheduleData(); });
  es.addEventListener('notice', e => { ingestNotice(JSON.parse(e.data)); scheduleData(); });
  es.addEventListener('notices-cleared', () => { S.notices = []; S.fresh = new Set(); schedule(); }); // 托盘预览或别的页面清空了
  es.addEventListener('deleted', e => {
    const gone = new Set(JSON.parse(e.data).ids);
    for (const id of gone) S.sessions.delete(id);
    S.notices = S.notices.filter(n => !gone.has(n.sessionId));
    if (gone.has(S.sel)) S.sel = null;
    schedule();
  });
  es.onerror = () => { S.conn = 'lost'; schedule(); };
}

    S.activity = act;
    S.sessions = new Map(ss.map(s => [s.id, s]));
    S.notices = ns;
    S.conn = 'live';
  } catch {

// ============ 渲染调度（不依赖 rAF：主页面隐藏时小窗也要更新） ============
let queued = false;
function schedule() {
  if (queued) return;
  queued = true;
  queueMicrotask(() => { queued = false; clearTimeout(dataT); dataT = 0; render(); });
}
// 推送来的数据变化：最多每 120ms 画一次。很多 agent 同时在勾时，一阵推送合成一次渲染；
// 平时（两次推送间隔超过 120ms）仍是到了马上画
let dataT = 0, lastData = 0;
function scheduleData() {
  if (queued || dataT) return;
  const wait = lastData + 120 - performance.now();
  if (wait <= 0) { lastData = performance.now(); schedule(); return; }
  dataT = setTimeout(() => { dataT = 0; lastData = performance.now(); render(); }, wait);
}
const root = $('root');
// 渲染计数（压测脚本经 window.__tick 读取，见 .shots/stress.mjs）
const PERF = { n: 0, ms: 0, max: 0 };
function render() {
  const t0 = performance.now();
  try { renderNow(); } finally { const d = performance.now() - t0; PERF.n++; PERF.ms += d; if (d > PERF.max) PERF.max = d; }
}

// ======================================================================
// 右下角提醒卡
// 悬浮窗页面发现“勾了一项 / 做完 / 没做成 / 等你 / 卡住 / agent 主动提醒”时，把卡片交给宿主，
// 宿主在屏幕右下角开一个小窗口（view=toast）显示。每张卡底部一条倒计时，走完自动消失；
// 鼠标停在上面暂停，点卡片打开悬浮窗并定位到那个会话，点叉号关掉。
// 同一个会话只占一张卡：新的事件替换旧的（“勾了一项”不会盖掉“等你 / 做完”）。
// ======================================================================
const TOAST_TTL = { item: 6000, done: 9000, failed: 12000, waiting: 30000, blocked: 30000, info: 7000, success: 7000, warning: 9000 };
const TOAST_RANK = { item: 0, info: 1, success: 1, warning: 1, done: 2, failed: 2, waiting: 3, blocked: 3 };
function toastCard(s, kind, extra = {}) {
  const a = agentOf(s?.agent || extra.agentId);
  const p = s ? progress(s) : { done: 0, total: 0 };
  return { id: `${now()}-${Math.random().toString(36).slice(2, 6)}`, sid: s?.id || '', kind, agent: a.name, mark: a.mark, color: a.color,
    sub: s?.title || '', done: p.done, total: p.total, ttl: (TOAST_TTL[kind] || 7000) * ({ short: 0.5, long: 2 }[S.toastLen] || 1), ...extra };
}
// “勾了一项”的卡：同一会话 700ms 内最多发一次，期间勾的合成一张（card.add = 合了几项）。
// 多个 agent 一起高频勾时，提醒卡窗口不用每条都重画、重启倒计时
const itemQ = new Map(), itemLast = new Map([['', 0]]);
let itemT = 0;
function sendToast(card) {
  if (!NATIVE || typeof window.tickToast !== 'function' || S.dnd) return;
  const sid = card.sid;
  if (card.kind === 'item' && sid) {
    const q = itemQ.get(sid);
    card.add = (q?.add || 0) + 1;
    itemQ.delete(sid);
    itemQ.set(sid, card); // 放到最后：最近勾的排在后面
    if (!itemT && now() - itemLast.get('') > 700) { flushItems(); return; }
    itemT ||= setTimeout(flushItems, Math.max(50, 700 - (now() - (itemLast.get('') || 0))));
    return;
  }
  if (sid) itemQ.delete(sid); // 等你 / 做完这类卡会盖掉还没发出去的“勾了一项”
  window.tickToast(JSON.stringify(card));
}
// 发出攒着的“勾了一项”：全局 700ms 一批，一批最多 2 张（最近勾的两个会话）；
// 再多的会话同时在勾时，进度在悬浮窗里看，右下角不刷屏
function flushItems() {
  itemT = 0;
  itemLast.set('', now());
  for (const c of [...itemQ.values()].slice(-2)) window.tickToast(JSON.stringify(c));
  itemQ.clear();
}

// ---------- 提醒卡窗口（view=toast） ----------
function startToast() {
  S.toasts = [];
  document.documentElement.dataset.theme = S.theme;
  window.tickToastGlass?.().then(on => document.documentElement.toggleAttribute('data-glass', !!on));
  // 宿主每来一张卡调用一次；同一会话合并
  window.tickToastAdd = card => {
    const k = S.toasts.findIndex(x => x.sid && x.sid === card.sid);
    if (k >= 0) {
      const old = S.toasts[k];
      if (TOAST_RANK[card.kind] < TOAST_RANK[old.kind] && old.kind !== 'item') return; // 勾一项不盖掉等你 / 做完
      card.n = old.kind === 'item' && card.kind === 'item' ? (old.n || 1) + (card.add || 1) : card.add || 1;
      S.toasts.splice(k, 1);
    } else card.n = card.add || 1;
    S.toasts.push(card);
    if (S.toasts.length > 4) S.toasts.splice(0, S.toasts.length - 4);
    scheduleData(); // 一批卡连着到时合成一次重画
  };
  root.addEventListener('animationend', e => {
    if (!e.target.classList?.contains('tc-bar')) return;
    const id = e.target.dataset.id;
    S.toasts = S.toasts.filter(x => x.id !== id);
    schedule();
  });
  root.addEventListener('click', e => {
    const c = e.target.closest('.tc');
    if (!c) return;
    const card = S.toasts.find(x => x.id === c.dataset.id);
    S.toasts = S.toasts.filter(x => x !== card);
    schedule();
    if (!e.target.closest('[data-act="tc-close"]') && card?.sid) window.tickToastOpen(card.sid);
  });
  new ResizeObserver(() => {
    const r = root.firstElementChild?.getBoundingClientRect();
    window.tickToastFit(Math.ceil(r?.width || 0), S.toasts.length ? Math.ceil(r?.height || 0) : 0);
  }).observe(root);
  render();
  window.tickToastReady();
}

  };
  window.tickMenuHidden = () => { pickClose(); tipHide(); S.menuErr = null; root.querySelector('.mn')?.blur(); };
  // 开关先在界面上拨过去，再等宿主改；宿主回来的状态和点的不一样就是没改成，拨回去并说一声。
  // 只核对同步生效的两项（写注册表 / 存设置）；置顶、贴边这些宿主排队异步改，回来时可能还是旧值
  const CHECKED = { autostart: ['autostart', '开机启动没设上'], autoupdate: ['autoUpdate', '自动更新没改成'] };
  const act = async (name, on, val = '') => {
    let st = '';

    } else if (S.menu && name in OPT) S.menu[OPT[name]] = on; // 异步项：保持刚拨的样子，下次弹出时以宿主为准

  };

    const b = e.target.closest('[data-m]');

    if (b.dataset.m === 'theme') { S.menu.theme = S.menu.themes.find(t => t.id === b.dataset.v) || S.menu.theme; renderMenu(); } // 先换上，宿主存好后再推给悬浮窗
    if (b.hasAttribute('aria-pressed')) {

  // 报布局尺寸（offset*），不受入场动画的缩放影响
  new ResizeObserver(() => {
    const el = root.firstElementChild;
    if (el?.offsetHeight) window.tickMenuFit(el.offsetWidth, el.offsetHeight);

}

// 悬浮窗
