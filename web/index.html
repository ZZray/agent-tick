function floatData() {
  const t = now();
  const unread = S.notices.filter(n => !n.read);
  // 等你 / 受阻做成卡片，按会话状态判断：会话转为等你和那条通知是分两帧推来的，
  // 只看通知的话，中间那一帧会话会先在列表里跳一下再变成卡片。
  // 通知还没到时先用会话里的问题顶上；用户点过“知道了”（通知已读）就回到列表里
  const cards = [];
  for (const s of visible().filter(isWaiting).sort((a, b) => b.waitSince - a.waitSince)) {
    const n = S.notices.find(x => x.sessionId === s.id && (x.kind === 'waiting' || x.kind === 'blocked') && x.at >= s.waitSince - 2000);
    // 刚打开抽屉时自动标了已读的那几条：这次打开期间卡片照样留着
    if ((n?.read && !(S.drawer && S.fresh?.has(n.id))) || S.dismissed.has(`${s.id}:${s.waitSince}`)) continue;
    cards.push(n || { id: '', at: s.waitSince || s.updatedAt, sessionId: s.id, agent: s.agent, kind: s.status, title: s.title, text: s.statusNote || STATUS[s.status], read: false });
  }
  // 正在跑的排最上面，其次等你 / 受阻，再是写清单，很久没动静的垫底。
  // 同一档按登记时间排（方向看逆序开关），不按最近更新排，否则 agent 每勾一条整列就跳一次
  const rank = s => (s.status === 'running' && !isDormant(s) ? 0 : isWaiting(s) ? 1 : s.status === 'planning' ? 2 : 3);
  const live = visible();
  // 子 agent 的会话显示在主会话下面，不单独占一行（主会话不在了才单独显示）
  const top = live.filter(s => !isChild(s));
  const open = top.filter(s => !isEnded(s)).sort((a, b) => rank(a) - rank(b) || byOrder(a, b));
  // 说在跑、但 30 分钟没更新的单独成组（“可能掉线了”），不占“进行中”的位置
  const active = open.filter(s => !isDormant(s));
  const stale = open.filter(isDormant);
  const recent = top.filter(s => isEnded(s) && t - s.endedAt < 30 * MIN)
    .sort((a, b) => (S.order === 'old' ? a.endedAt - b.endedAt : b.endedAt - a.endedAt));
  // 标题上的数字按列表里的行数（一个任务一行，子 agent 算在主任务里）：
  // 自己或手下的子 agent 在等你的算“等你”，其余算“进行中”，两个数加起来就是“进行中”分组的行数
  const needsYou = s => isWaiting(s) || childrenOf(s).some(isWaiting);
  // （主任务掉线了、子 agent 还在等你的也要数上，不能把等你的漏掉）
  const nW = [...active, ...stale].filter(needsYou).length;
  const nR = active.filter(s => !needsYou(s)).length;
  return { unread, cards: cards.slice(0, 3), active, stale, recent, nW, nR };
}

// 左上角 logo 点开的 Agent 面板：每个 agent 一行（几个在跑、几个等你、最近一条动态、多久前），
// 按最近动静排；点一行定位到它最近动过的会话。底下是连接状态和接入入口
function agentsHtml() {
  const by = new Map();
  for (const s of visible()) {
    let g = by.get(s.agent);
    if (!g) by.set(s.agent, g = { agent: s.agent, run: 0, wait: 0, last: null });
    if (isWaiting(s)) g.wait++;
    else if (!isEnded(s) && !isDormant(s)) g.run++;
    const e = s.events?.[s.events.length - 1];
    if (e && (!g.last || e.at > g.last.e.at)) g.last = { s, e };
  }
  const rows = [...by.values()].sort((a, b) => (b.last?.e.at || 0) - (a.last?.e.at || 0));
  // “勾选 #3 复现：…” 这类动态文字本身就写清楚了；登记 / 关联类补上会话标题
  const evText = x => {
    const ev = evTr(x.e.text);
    return /^(登记会话|重新关联)/.test(x.e.text) ? `${ev}${EN ? ': ' : '「'}${x.s.title}${EN ? '' : '」'}` : ev;
  };
  const row = g => {
    const a = agentOf(g.agent);
    const x = g.last;
    return `<button class="ag-row" data-key="ag-${esc(g.agent)}" data-enter="fade" data-act="agent-go"${x ? ` data-sid="${esc(x.s.id)}" data-tip="${esc(`${x.s.title}\n${evTr(x.e.text)}`)}"` : ''}>
      <span class="tile" style="--ac:${a.color}">${esc(a.mark)}</span>
      <span class="ag-m"><span class="ag-n"><b class="trunc">${esc(a.name)}</b>${g.wait ? `<span class="ag-w num">${g.wait} 个在等你</span>` : ''}${g.run ? `<span class="ag-r num">${g.run} 个进行中</span>` : ''}</span>
        ${x ? `<span class="ag-e trunc">${esc(firstLine(evText(x)))}</span>` : ''}</span>
      ${x ? `<span class="when num" data-clock="ago" data-at="${x.e.at}">${ago(x.e.at)}</span>` : ''}</button>`;
  };
  return `<aside class="f-drawer f-agents" data-key="agents" data-exit="fade">
    <header class="dr-top" data-drag><button class="ib dr-back" data-act="agents" data-tip="返回（Esc）" aria-label="返回">${IC.chevL}</button><b>Agent</b><span class="grow"></span>${connChip()}</header>
    <div class="dr-body">${rows.length ? `<div class="ag-list">${rows.map(row).join('')}</div>`
      : `<div class="dr-empty">${IC.plug}<b>还没有 agent 来报到</b><span>把 Tick 加进 agent 的 MCP 配置，它写下第一份清单就会出现在这里。</span></div>`}</div>
    <footer class="dr-foot"><button class="btn primary" data-act="copy-mcp">${IC.copy}复制 MCP 地址</button><span class="grow"></span><button class="btn ghost" data-act="guide">接入说明</button></footer>
  </aside>`;
}

// ============ 增量更新：按 data-key 复用节点，过渡和动画才有地方挂 ============
// 整块 innerHTML 会让每帧 SSE 都重播入场动画、打断进度过渡、让流光从头开始。
// 这里把新 HTML 和现有 DOM 对齐：同 key 复用、新的入场、走的退场、移动的用 FLIP 平移过去。
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const EASE_OUT = 'cubic-bezier(.23,1,.32,1)';
const EASE_IN_OUT = 'cubic-bezier(.77,0,.175,1)';
const keyOf = n => (n.nodeType === 1 ? n.getAttribute('data-key') : null);
// 正在退场的节点和运行时加进去的特效层（data-fx，比如边缘流光）不参与比对，重绘时原样留着
const isLeaving = n => n.nodeType === 1 && (n.hasAttribute('data-leaving') || n.hasAttribute('data-fx'));

function morph(parent, html) {
  const t = parent.ownerDocument.createElement('template');
  t.innerHTML = tr(html);
  const entered = [];
  patchChildren(parent, t.content, entered);
  return entered;
}

function patchChildren(parent, next, entered) {
  // 正在退场的节点又出现了（比如退场 180ms 内同一条又来了）：取消退场，原地复用，不要出现两份
  for (const n of [...parent.childNodes]) {
    if (!isLeaving(n)) continue;
    const k = keyOf(n);
    if (k && [...next.childNodes].some(x => keyOf(x) === k)) {
      n.getAnimations().forEach(a => a.cancel());
      n.removeAttribute('data-leaving');
      n.style.pointerEvents = '';
      n.style.overflow = '';
    }
  }
  const old = [...parent.childNodes].filter(n => !isLeaving(n));
  const nextNodes = [...next.childNodes];
  // FLIP 要量每个条目的位置（会强制排版）；条目的顺序和成员都没变时没什么可动的，不量
  const flip = parent.nodeType === 1 && parent.hasAttribute('data-flip') &&
    (old.length !== nextNodes.length || old.some((o, i) => keyOf(o) !== keyOf(nextNodes[i])));
  // FLIP 只量条目相对父容器的位置：父容器自己被别的分组推下去不算“移动”，否则会和撑开动画叠在一起
  const rel = el => el.getBoundingClientRect().top - parent.getBoundingClientRect().top;
  const first = new Map();
  const byKey = new Map();
  for (const o of old) {
    const k = keyOf(o);
    if (!k) continue;
    byKey.set(k, o);
    if (flip) first.set(o, rel(o));
  }
  const used = new Set();
  const finals = [];
  let u = 0;
  for (const nn of nextNodes) {
    const k = keyOf(nn);
    let m = k ? byKey.get(k) : null;
    if (!k) {
      while (u < old.length && (used.has(old[u]) || keyOf(old[u]))) u++;
      if (old[u] && old[u].nodeName === nn.nodeName) m = old[u++];
    }
    if (m && m.nodeName === nn.nodeName) {
      used.add(m);
      patchNode(m, nn, entered);
      finals.push(m);
    } else {
      finals.push(nn);
      if (k) entered.push(nn);
    }
  }
  for (const o of old) {
    if (used.has(o)) continue;
    if (keyOf(o) && o.hasAttribute('data-exit')) leave(o);
    else o.remove();
  }
  let ref = parent.firstChild;
  for (const n of finals) {
    while (ref && ref !== n && isLeaving(ref)) ref = ref.nextSibling;
    if (ref === n) { ref = ref.nextSibling; continue; }
    parent.insertBefore(n, ref);
  }
  // FLIP：位置变了的条目从旧位置平移过来。要等新条目的撑开动画先把它压到 0 高度再量，
  // 否则会把“被新条目推下去”误当成移动，两种动画叠在一起
  if (flip && !RM.matches) flips.push(() => {
    for (const [el, top] of first) {
      if (!el.isConnected || isLeaving(el)) continue;
      const dy = top - rel(el);
      if (Math.abs(dy) > 1) el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 260, easing: EASE_IN_OUT });
    }
  });
}
let flips = [];
function settle(entered, opts) {
  if (entered) enter(entered, opts);
  const run = flips;
  flips = [];
  for (const f of run) f();
}

function patchNode(o, n, entered) {
  if (o.nodeType !== 1) {
    if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue;
    return;
  }
  // 带 data-key 的块（会话行、通知、卡片）：模板和上次一字不差就整块跳过，不逐个比属性和子节点。
  // 多会话高频更新时，每次通常只有一两行真的变了
  let html = null;
  if (n.hasAttribute('data-key')) {
    html = n.outerHTML;
    if (o._h === html) return;
  }
  // style 归运行时（动画期间的裁切等），模板里不写 style，这里也不去删它
  // data-ph 是点阵的动画阶段，也归运行时
  for (const a of [...o.attributes]) if (a.name !== 'style' && a.name !== 'data-ph' && !n.hasAttribute(a.name)) o.removeAttribute(a.name);
  for (const a of [...n.attributes]) if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value);
  const roll = o.hasAttribute('data-roll') ? o.textContent : null;
  patchChildren(o, n, entered);
  if (roll !== null && roll !== o.textContent) rollIn(o, Number(o.textContent) < Number(roll) ? -1 : 1);
  o._h = html;
}

// 数字变化：新值从下往上滚进来（变小时从上往下）
function rollIn(el, dir) {
  if (RM.matches) return;
  el.animate([{ transform: `translateY(${dir * 45}%)`, opacity: 0, filter: 'blur(1px)' }, { transform: 'none', opacity: 1, filter: 'blur(0)' }], { duration: 200, easing: EASE_OUT });
}

// 入场：grow 撑开高度（窗口跟着长），fade 只淡入。stagger 让一批新条目依次到达
function enter(all, { stagger = 40, fadeOnly = false } = {}) {
  // 只动最外层的新节点：新行里面的子节点跟着父节点一起出现，不再各自排队
  const list = all.filter(el => !all.some(o => o !== el && o.contains(el)));
  list.forEach((el, i) => {
    const delay = Math.min(i, 7) * stagger;
    const mode = fadeOnly ? 'fade' : el.dataset.enter || 'fade';
    if (RM.matches) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, delay, fill: 'backwards' }); return; }
    if (mode === 'grow') {
      const h = el.getBoundingClientRect().height;
      const cs = getComputedStyle(el);
      el.style.overflow = 'hidden';
      const a = el.animate([
        { height: '0px', marginTop: '0px', marginBottom: '0px', opacity: 0, transform: 'translateY(-4px)' },
        { height: `${h}px`, marginTop: cs.marginTop, marginBottom: cs.marginBottom, opacity: 1, transform: 'none' },
      ], { duration: 240, easing: EASE_OUT, delay, fill: 'backwards' });
      a.onfinish = a.oncancel = () => { el.style.overflow = ''; };
    } else {
      el.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: EASE_OUT, delay, fill: 'backwards' });
    }
    // 新的“等你”卡片：边沿扫过一道光，只扫一次（只给真正新来的卡片，面板整块重建时不扫）
    if (!fadeOnly && el.matches?.('.n-card')) {
      el.querySelector('.n-glow')?.animate([{ backgroundPosition: '120% 0', opacity: 1 }, { backgroundPosition: '-20% 0', opacity: 0 }], { duration: 600, delay: delay + 100, easing: 'linear', fill: 'backwards' });
    }
  });
}

// 退场比入场快（约 0.75×），先让出位置再删掉
function leave(el) {
  el.setAttribute('data-leaving', '');
  el.style.pointerEvents = 'none';
  // 从当前样子开始退：入场还没播完就要走时，不先跳回完全不透明
  const h = el.getBoundingClientRect().height;
  const cs = getComputedStyle(el);
  const op = cs.opacity;
  el.getAnimations().forEach(a => a.cancel());
  // 只在动画真正播完时删除；被取消（又回来了）时留着
  const done = a => { if (a.target.playState === 'finished' && el.hasAttribute('data-leaving')) el.remove(); };
  const run = (frames, opts) => { el.animate(frames, opts).addEventListener('finish', done); };
  if (RM.matches) { run([{ opacity: op }, { opacity: 0 }], { duration: 120, fill: 'forwards' }); return; }
  if (el.dataset.exit === 'fade') { run([{ opacity: op }, { opacity: 0 }], { duration: 140, easing: EASE_OUT, fill: 'forwards' }); return; }
  el.style.overflow = 'hidden';
  run([
    { height: `${h}px`, marginTop: cs.marginTop, marginBottom: cs.marginBottom, opacity: op },
    { height: '0px', marginTop: '0px', marginBottom: '0px', opacity: 0 },
  ], { duration: 180, easing: EASE_OUT, fill: 'forwards' });
}

// 外部触发的一次性提示：标题栏橙点外扩一圈
function ping(el) {
  if (!el || RM.matches) return;
  el.animate([{ boxShadow: '0 0 0 0 rgba(242,153,74,.55)' }, { boxShadow: '0 0 0 7px rgba(242,153,74,0)' }], { duration: 560, easing: EASE_OUT });
}

function renderFloat(el, mode) {
  const d = floatData();
  const live = sweeper();
  const first = !el.firstElementChild;
  const nUnread = d.unread.length;
  const bell = S.compact ? '' : `<button class="ib bell${S.drawer ? ' on' : ''}${nUnread ? ' unread' : ''}${d.cards.length ? ' hot' : ''}" data-key="a-bell" data-act="drawer"
      data-tip="${S.drawer ? '收起通知' : nUnread ? `${nUnread} 条未读通知` : '通知'}" aria-pressed="${S.drawer}">${IC.bell}${nUnread ? `<span class="bdg num" data-roll>${nUnread > 99 ? '99+' : nUnread}</span>` : ''}</button>`;
  const acts = `<div class="f-acts">
    ${bell}
    ${mode === 'native' && !S.compact ? `<button class="ib pin${S.pinned ? ' on' : ''}" data-key="a-pin" data-act="pin" data-tip="${S.pinned ? '取消置顶' : '置顶'}" aria-pressed="${S.pinned}">${IC.pinMorph}</button>` : ''}
    <button class="ib" data-key="a-compact" data-act="compact" data-tip="${S.compact ? '展开（双击标题栏也行）' : '收起成一行（双击标题栏也行）'}">${S.compact ? IC.expand : IC.collapse}</button>
    ${mode !== 'pip' && !S.compact ? `<button class="ib" data-key="a-panel" data-act="panel" data-tip="打开面板">${IC.panel}</button>` : ''}
    ${mode === 'native' ? `<button class="ib" data-key="a-hide" data-act="hide" data-tip="收到托盘（点托盘图标叫回来）">${IC.toTray}</button>` : ''}
  </div>`;
  const counts = d.nR || d.nW
    ? `${d.nR ? `<span data-key="c-r"><b data-roll>${d.nR}</b> 进行中</span>` : ''}${d.nW ? `<span class="w" data-key="c-w"><i class="wdot"></i><b data-roll>${d.nW}</b> 等你</span>` : ''}`
    : '<span data-key="c-q">都安静着</span>';
  const group = (key, title, count, body, act = '') => `<section class="grp" data-key="${key}" data-enter="grow" data-exit>
    <div class="g-h">${title} <span class="c num" data-roll>${count}</span><span class="grow"></span>${act}</div>${body}</section>`;
  // 组头的操作只放图标，鼠标移到组头上才出现（文字写在提示里）
  const sortBtn = `<span class="g-tools"><button class="ib" data-act="order" data-tip="${S.order === 'old' ? '现在最早登记的在前，点一下换成最新在前' : '现在最新登记的在前，点一下倒过来'}" aria-label="切换排序">${S.order === 'old' ? IC.sortUp : IC.sortDown}</button></span>`;
  // 刚结束：默认收起成一行，组头是一个大一点的完成勾 + 数量 + 标题预览；点组头展开，高度用 grid 0fr ↔ 1fr 过渡
  const hist = d.recent.length ? `<section class="grp hist${S.histOpen ? ' open' : ''}" data-key="g-d" data-enter="grow" data-exit>
      <div class="g-h"><button class="g-fold" data-act="hist" aria-expanded="${S.histOpen}" data-tip="${S.histOpen ? '收起' : '刚结束的会话（30 分钟内），点开看'}" aria-label="刚结束 ${d.recent.length} 个">${IC.chev}${IC.doneBig}<span class="c num" data-roll>${d.recent.length}</span></button>
        <span class="g-peek trunc" data-key="peek">${S.histOpen ? '' : esc(d.recent.slice(0, 3).map(s => s.title).join(' · '))}</span>
        <span class="g-tools"><button class="ib" data-act="archive-ended" data-tip="清掉：归档这些会话，面板“已归档”里能找回" aria-label="清掉刚结束的会话">${IC.archive}</button></span></div>
      <div class="g-body"><div><div class="s-list" data-flip>${d.recent.map(s => sessionRow(s, live)).join('')}</div></div></div></section>` : '';
  // 可能掉线了：默认收起成一行，写明为什么归到这里；组头可以一键全部结束（能撤销）
  const staleG = d.stale.length ? `<section class="grp hist stale-g${S.staleOpen ? ' open' : ''}" data-key="g-s" data-enter="grow" data-exit>
      <div class="g-h"><button class="g-fold" data-act="stale-fold" aria-expanded="${!!S.staleOpen}" data-tip="${S.staleOpen ? '收起' : '说在跑、但 30 分钟没有更新：agent 多半被关了、丢了上下文，或者忘了收尾'}">${IC.chev}${sicon('dormant')}<span class="g-t">可能掉线了</span><span class="c num" data-roll>${d.stale.length}</span></button>
        <span class="g-peek trunc" data-key="peek-s">${S.staleOpen ? '' : esc(d.stale.slice(0, 3).map(s => s.title).join(' · '))}</span>
        <span class="g-tools"><button class="ib" data-act="end-stale" data-tip="全部结束：标成已取消（agent 回来接着报会自动恢复）" aria-label="全部结束">${IC.x}</button></span></div>
      <div class="g-body"><div><div class="s-list" data-flip>${d.stale.map(s => sessionRow(s, live)).join('')}</div></div></div></section>` : '';
  // 贴边收起时整块换成小标签（或消息气泡）；外层 .f 的尺寸在两种形态之间平滑变形，原生窗口跟着长
  const tucked = mode === 'native' && S.dock.tucked;
  // 新的“等你 / 受阻”到了：下次以完整面板出现时自动拉开抽屉（收着、胶囊时先不撑大窗口）
  // 这时问题已经被处理（看过、回答了、agent 接着跑了）就不拉了，免得打开一个空抽屉
  if (S.drawerWant && !tucked && !S.compact) { if (d.cards.length) { S.drawer = true; S.drawerTab = 'unread'; S.drawerAuto = true; S.fresh = new Set(); } S.drawerWant = false; }
  // 自动拉开的抽屉只为那几个问题：都处理完就回主面板，不因为还有别的未读停在通知页
  // 在别处全部已读了（托盘预览、点托盘图标、全部已读按钮）也回主面板；打开抽屉时自己标的已读（S.fresh）不算
  else if (S.drawer && ((S.drawerAuto && !d.cards.length) || (S.lastUnread > 0 && !d.unread.length && !S.fresh?.size))) {
    S.drawer = false; S.drawerAuto = false; S.fresh = new Set();
  }
  S.lastUnread = d.unread.length;
  const drawer = S.drawer && !tucked && !S.compact;
  const sheet = S.agentsOpen && !drawer && !tucked && !S.compact; // logo 点开的 Agent 面板，和通知抽屉二选一
  const fan = S.fan && mode === 'native' && S.compact && !tucked;
  const main = `<div class="f-in" data-key="full" data-enter="fade">
    <header class="f-top" data-drag>
      ${S.compact ? `<span class="logo">${IC.logo}</span>`
        : `<button class="f-logo${S.conn === 'lost' ? ' lost' : ''}${sheet ? ' on' : ''}" data-act="agents" aria-pressed="${sheet}"
            data-tip="${sheet ? '收起' : S.conn === 'lost' ? '和 Tick 服务断开了，正在重连。点开看 agent' : 'Agent：谁接入了、最近在做什么'}"><span class="logo">${IC.logo}</span></button>`}
      ${S.compact ? pillHtml(d, live) : `<span class="f-brand">Tick</span><span class="f-cnt num">${counts}</span>`}
      ${mode === 'native' && S.dnd && !S.compact ? `<button class="ib dnd-on" data-key="a-dnd" data-act="dnd" data-tip="勿扰中：不弹通知和气泡。点一下结束">${IC.moon}</button>` : ''}
      ${acts}
    </header>
    <div class="f-body">
      ${d.active.length ? group('g-a', '进行中', d.active.length, `<div class="s-list" data-flip>${d.active.map(s => sessionRow(s, live)).join('')}</div>`, d.active.length + d.recent.length > 1 ? sortBtn : '') : ''}
      ${staleG}
      ${hist}
      ${S.undo && now() < S.undo.until ? `<div class="undo" data-key="undo" data-enter="grow" data-exit><span>${esc(tr(S.undo.text))}</span><button class="g-act" data-act="undo">撤销</button></div>` : ''}
      ${!d.active.length && !d.recent.length && !d.stale.length ? floatEmpty() : ''}
    </div>
  </div>`;
  // 抽屉盖在当前窗口上（从铃铛那里展开），窗口不变宽；内容太矮时窗口长高一些给抽屉留地方
  // 有没看的通知、抽屉又没开：外框呼吸。颜色跟最要紧的那条走（受阻 / 没做成红，等你橙，其余主题色）
  const breathC = !drawer && !fan && !S.dnd && d.unread.length
    ? (d.unread.some(n => n.kind === 'blocked' || n.kind === 'failed') ? 'var(--red)' : d.unread.some(n => n.kind === 'waiting') ? 'var(--orange)' : 'var(--brand)') : '';
  const breath = breathC ? `<i class="breath" data-key="breath" data-enter="fade" data-exit="fade" style="--bc:${breathC}" aria-hidden="true"></i>` : '';
  const inner = (tucked ? tabHtml(d, live) : fan ? `<div class="f-in" data-key="fan-in">${fanHtml(d, live)}</div>` : drawer ? main + drawerHtml(d) : sheet ? main + agentsHtml() : main) + breath;
  const html = `<div class="f${mode === 'native' ? ' native' : ' fill'}${S.compact ? ' pill' : ''}${tucked ? ' tucked' : ''}${tucked && d.nW ? ' hot' : ''}${drawer ? ' drawer' : ''}${sheet ? ' sheet' : ''}${fan ? ' fanning' : ''} side-${S.side} v-${S.vside}">${inner}</div>`;
  // 只在形态变化（面板 ↔ 标签 ↔ 气泡 ↔ 胶囊 ↔ 抽屉 ↔ Agent 面板 ↔ 转盘）时做盒子变形；内容变高由条目自己的撑开动画负责
  const shape = `${tucked}|${tucked && !!S.speak}|${S.compact}|${drawer}|${sheet}|${fan}`;
  const box = el.firstElementChild;
  let from = null;
  if (mode === 'native' && box && el._shape !== shape) {
    box._box?.cancel(); // 先停掉上一个变形再量：量到的才是现在真正的尺寸
    from = box.getBoundingClientRect();
  }
  el._shape = shape;
  const entered = morph(el, html);
  // 横条 ↔ 环形列表的变形由 morphFan 自己做（要绕着鼠标那一点长），这里不做
  if (el._fan === fan) boxMorph(el.firstElementChild, from);
  el._fan = fan;
  // 第一次画：整组依次淡入，不撑高度；之后：新条目撑开进场
  if (first) settle([...el.querySelectorAll('.grp, .f-empty, .tb')], { stagger: 50, fadeOnly: true });
  else settle(entered);
  if (d.nW > (el._nW ?? d.nW)) ping(el.querySelector('.wdot') || el.querySelector('.mini.waiting'));
  el._nW = d.nW;
  if (!el._wired) wireFloat(el, mode);
}

// 外层盒子从旧尺寸变到新尺寸：标签 ↔ 面板 ↔ 气泡之间的“长出来 / 缩回去”。
// 只在尺寸确实变了时做；再次触发会从当前尺寸接着变（先量的是动画中的尺寸）
// 曲线用标准缓动而不是强 ease-out：后者头 30ms 就走完六成，看起来像从起点直接跳到终点，没有“中间”
const EASE_BOX = 'cubic-bezier(.4,0,.2,1)';
function boxMorph(f, from) {
  if (!f || !from || RM.matches) return;
  const to = f.getBoundingClientRect();
  if (Math.abs(from.width - to.width) < 1 && Math.abs(from.height - to.height) < 1) return;
  const grow = to.width * to.height > from.width * from.height;
  f._box = f.animate([{ width: `${from.width}px`, height: `${from.height}px` }, { width: `${to.width}px`, height: `${to.height}px` }],
    { duration: grow ? 300 : 260, easing: EASE_BOX });
}

// 通知抽屉：铃铛拉开，在朝屏幕中间的那一侧。最上面是“等你 / 受阻”卡片（能回到对话、复制接力提示），
// 下面是通知列表：点一行标为已读并在主面板里定位会话；底部选提示音
function drawerHtml(d) {
  const unread = d.unread.length;
  const inCard = new Set(d.cards.map(n => n.id).filter(Boolean));
  const fresh = S.fresh || new Set();
  const list = S.notices.filter(n => !inCard.has(n.id) && (S.drawerTab === 'all' || !n.read || fresh.has(n.id))).slice(0, 60);
  const tab = (k, label, n) => `<button class="${S.drawerTab === k ? 'on' : ''}" data-act="dtab" data-tab="${k}" aria-pressed="${S.drawerTab === k}">${label}${n ? `<span class="num">${n}</span>` : ''}</button>`;
  const allRead = S.drawerTab === 'unread' && S.notices.length > 0;
  const empty = !d.cards.length && !list.length
    ? `<div class="dr-empty" data-key="dr-empty-${S.drawerTab}" data-enter="fade">${IC.bellOff}<b>${allRead ? '都看过了' : '还没有通知'}</b>
        ${allRead ? '<button class="g-act" data-act="dtab" data-tab="all">看全部通知</button>' : '<span>agent 需要你拍板、卡住或做完时，会在这里留一条。</span>'}</div>`
    : '';
  const sound = NATIVE && S.sounds.length ? `<footer class="dr-foot">
      <span class="dr-snd"><span class="dr-si" data-tip="新通知时响的提示音">${IC.sound}</span>${pickHtml('sound', [{ id: '', name: '不响' }, ...S.sounds], S.sound, '提示音')}</span>
      <span class="grow"></span>
      ${S.sound ? `<button class="ib" data-act="sound-test" data-tip="试听">${IC.play}</button>` : ''}
      <button class="ib" data-act="sound-dir" data-tip="打开声音文件夹：放进自己的 .wav 就能选">${IC.folder}</button></footer>` : '';
  // 标题栏：左边返回箭头（回到会话列表，不是关窗口），右边是操作和页签
  return `<aside class="f-drawer" data-key="drawer" data-exit="fade">
    <header class="dr-top" data-drag><button class="ib dr-back" data-act="drawer" data-tip="返回（Esc）" aria-label="返回">${IC.chevL}</button><b>通知</b><span class="grow"></span>
      ${unread ? '<button class="g-act" data-act="read-all">全部已读</button>' : S.notices.length ? '<button class="g-act dr-clear" data-act="clear-notices" data-tip="清空通知历史（会话不受影响）">清空</button>' : ''}
      <span class="seg">${tab('unread', '未读', unread || fresh.size)}${tab('all', '全部', 0)}</span></header>
    <div class="dr-body">
      ${d.cards.length ? `<div class="n-area" data-flip>${d.cards.map(cardHtml).join('')}</div>` : ''}
      ${list.length ? `<div class="dr-list" data-flip>${list.map(noticeRow).join('')}</div>` : ''}
      ${empty}
    </div>
    ${sound}
  </aside>`;
}

// 胶囊悬停：环形任务列表。圆心 = 鼠标在横条上的位置（宿主把这一点钉在屏幕上，见 tickAnchor / fitAt），
// 最多显示 6 个（超出时第 6 个位置换成“+N”）。小圆 32、卡片 58 高（三行）、行距 66；
// 四周 pad 28 留给投影和悬停光圈，窗口透明时不会被边裁掉
const FAN = { max: 6, bub: 16, hub: 28, cw: 236, ch: 58, gap: 10, pad: 28, step: 66 };
// 布局照着草图：任务上下等距排成一列，横向沿圆弧往外鼓（离圆心远近随高度变），
// 卡片横着放在小圆外侧、右边缘对齐小圆；整列朝屏幕上空旷的那一侧（窗口靠右就往左排）
// pill：从横条拉开时横条相对圆心的位置 {l, t, r, b}。窗口要把横条原来的位置也包进去，
// 不然横条变成圆的那几帧，伸出窗口的那半截被裁掉，看着只剩半个
function fanLayout(n, room, pill) {
  const dir = room.l >= room.r ? -1 : 1;
  const half = (n - 1) * FAN.step / 2;
  // 上下放不下时整列往有空间的一边挪（圆心仍在鼠标下）
  const top = FAN.ch / 2 + FAN.pad, lim = v => Math.max(0, v - top);
  let y0 = -half;
  if (-y0 > lim(room.u)) y0 = -lim(room.u);
  if (y0 + 2 * half > lim(room.d)) y0 = Math.max(-lim(room.u), lim(room.d) - 2 * half);
  const R = Math.max(FAN.hub + FAN.bub + 52, Math.abs(y0) + 40, Math.abs(y0 + 2 * half) + 40);
  const items = [];
  const pts = [[-FAN.hub, -FAN.hub], [FAN.hub, FAN.hub]];
  if (pill) pts.push([pill.l, pill.t], [pill.r, pill.b]);
  for (let i = 0; i < n; i++) {
    const by = n <= 1 ? 0 : y0 + i * FAN.step;
    const bx = dir * Math.sqrt(R * R - by * by);
    const ax = bx + dir * (FAN.bub + FAN.gap);
    const cx = dir > 0 ? ax + FAN.cw : ax - FAN.cw;
    pts.push([bx - FAN.bub, by - FAN.bub], [bx + FAN.bub, by + FAN.bub], [cx, by - FAN.ch / 2], [ax, by + FAN.ch / 2]);
    items.push({ a: Math.atan2(by, bx) * 180 / Math.PI, len: Math.hypot(bx, by), bx, by, ax, ay: by, side: dir > 0 ? 'r' : 'l', kx: -dir * 10, ky: 0 });
  }
  const minX = Math.min(...pts.map(p => p[0])), maxX = Math.max(...pts.map(p => p[0]));
  const minY = Math.min(...pts.map(p => p[1])), maxY = Math.max(...pts.map(p => p[1]));
  return { items, hx: FAN.pad - minX, hy: FAN.pad - minY, W: Math.ceil(maxX - minX + 2 * FAN.pad), H: Math.ceil(maxY - minY + 2 * FAN.pad) };
}
function fanHtml(d, live) {
  const list = [...d.active, ...d.stale, ...d.recent];
  const shown = list.length > FAN.max ? list.slice(0, FAN.max - 1) : list;
  const more = list.length - shown.length;
  const n = Math.max(1, shown.length + (more > 0 ? 1 : 0));
  const f = S.fanFrom;
  const g = fanLayout(n, S.fanRoom || { l: 400, r: 400, u: 300, d: 300 }, f && { l: -f.mx, t: -f.my, r: f.w - f.mx, b: f.h - f.my });
  S.fanGeo = g;
  const stColor = s => (isWaiting(s) ? 'var(--orange)' : s.status === 'failed' ? 'var(--red)' : isEnded(s) ? 'var(--green)' : isDormant(s) ? 'var(--text-4)' : 'var(--brand)');
  const C = 2 * Math.PI * 14;
  const grp = (it, i, cls, sc, bubble, card, attrs = '') => `<div class="fg ${cls}" style="--i:${i};--sc:${sc}"${attrs}>
      <i class="fg-l" style="left:${g.hx}px;top:${g.hy}px;width:${it.len}px;transform:rotate(${it.a.toFixed(1)}deg)"></i>
      ${bubble(`left:${(g.hx + it.bx - FAN.bub).toFixed(1)}px;top:${(g.hy + it.by - FAN.bub).toFixed(1)}px;--dx:${(-it.bx).toFixed(1)}px;--dy:${(-it.by).toFixed(1)}px`)}
      ${card(`${it.side === 'l' ? `right:${(-(g.hx + it.ax)).toFixed(1)}px` : `left:${(g.hx + it.ax).toFixed(1)}px`};top:${(g.hy + it.ay - FAN.ch / 2).toFixed(1)}px;--kx:${it.kx}px;--ky:0px`)}
    </div>`;
  const one = (s, i) => {
    const it = g.items[i];
    const p = progress(s);
    const a = agentOf(s.agent);
    const step = current(s);
    const pct = p.total ? p.done / p.total : s.status === 'done' ? 1 : 0;
    const sub = isWaiting(s) && s.statusNote ? firstLine(s.statusNote) : step ? step.text : subline(s);
    const attr = `data-act="fan-open" data-sid="${esc(s.id)}"`;
    return grp(it, i, `st-${s.status}`, stColor(s),
      st => `<button class="fs" ${attr} data-key="fs-${esc(s.id)}" style="${st};--ag:${a.color}" aria-label="${esc(`${a.name} · ${s.title}`)}">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle class="fs-tr" cx="16" cy="16" r="14"/>
          <circle class="fs-arc" cx="16" cy="16" r="14" stroke-dasharray="${(pct * C).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 16 16)"/></svg>
        <span class="fs-m">${esc(a.mark)}</span>${isWaiting(s) ? '<i class="fs-dot"></i>' : ''}</button>`,
      st => `<button class="fc" ${attr} data-key="fc-${esc(s.id)}" style="${st}" tabindex="-1">
        ${sicon(isDormant(s) ? 'dormant' : s.status)}<span class="fc-t">${esc(s.title)}</span><span class="fc-p num">${p.total ? `${p.done}/${p.total}` : ''}</span>
        <span class="fc-s">${esc(firstLine(sub || STATUS[s.status]))}</span>
        <span class="fc-m"><span class="tile sm" style="color:${a.color}">${esc(a.mark)}</span>${esc(a.name)}<i class="dot"></i>${isDormant(s) ? '很久没动静' : STATUS[s.status]}<i class="dot"></i><span class="num" data-clock="short" data-sid="${esc(s.id)}">${short(elapsed(s))}</span></span></button>`,
      ` data-key="fg-${esc(s.id)}"`);
  };
  const act = d.active.length;
  const tot = d.active.reduce((t, s) => { const p = progress(s); t[0] += p.done; t[1] += p.total; return t; }, [0, 0]);
  const pct = tot[1] ? tot[0] / tot[1] : act ? 0 : 1;
  const HC = 2 * Math.PI * 24;
  const hub = `<button class="fh" data-act="fan-hub" data-key="fh" aria-label="展开悬浮窗" style="left:${g.hx - FAN.hub}px;top:${g.hy - FAN.hub}px">
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="24" fill="none" stroke="var(--line-strong)" stroke-width="3"/>
        <circle cx="28" cy="28" r="24" fill="none" stroke="${d.nW ? 'var(--orange)' : 'url(#tick-ring)'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(pct * HC).toFixed(1)} ${HC.toFixed(1)}" transform="rotate(-90 28 28)"/></svg>
      <b class="num">${act}</b>${d.nW ? '<i class="wd"></i>' : ''}</button>`;
  const body = list.length
    ? shown.map(one).join('') + (more > 0 ? grp(g.items[shown.length], shown.length, 'more', 'var(--text-3)',
      st => `<button class="fs" data-act="fan-more" data-key="fs-more" style="${st}" aria-label="展开看全部"><span class="fs-m num">+${more}</span></button>`,
      st => `<button class="fc solo" data-act="fan-more" data-key="fc-more" style="${st}" tabindex="-1"><span class="fc-t">还有 ${more} 个</span><span class="fc-s">展开悬浮窗看全部</span></button>`, ' data-key="fg-more"') : '')
    : grp(g.items[0], 0, 'empty', 'var(--text-4)', () => '',
      st => `<button class="fc solo" data-act="fan-hub" data-key="fc-empty" style="${st}" tabindex="-1"><span class="fc-t">都安静着</span><span class="fc-s">agent 开工后会从这里散出来</span></button>`, ' data-key="fg-empty"');
  return `<div class="fan" data-key="fan" aria-label="进行中的任务" style="width:${g.W}px;height:${g.H}px;--hx:${g.hx}px;--hy:${g.hy}px;--nudge:${g.items[0]?.side === 'l' ? -4 : 4}px">
    <i class="fan-at" style="left:${g.hx}px;top:${g.hy}px"></i>${body}${hub}</div>`;
}

// 贴边小标签：✓ 标志 + 每个活跃会话一个小进度环（最多 4 个）。有新消息时变成气泡（像灵动岛）
function tabHtml(d, live) {
  const t = now();
  const rank = s => (isWaiting(s) ? 0 : s.status === 'running' ? 1 : s.status === 'planning' ? 2 : 3);
  const list = visible().filter(s => !isChild(s) && (!isEnded(s) || t - s.endedAt < 30 * MIN)).sort((a, b) => rank(a) - rank(b) || b.createdAt - a.createdAt);
  const sp = S.speak;
  if (sp) {
    const verb = { waiting: '在等你', blocked: '卡住了', done: '做完了', failed: '没做成' }[sp.kind] || '';
    const text = sp.kind === 'done' || sp.kind === 'failed' ? sp.title || sp.text : sp.text;
    return `<div class="tb speak k-${esc(sp.kind)}" data-key="tab-speak-${esc(sp.id || sp.sessionId)}" data-enter="fade" data-drag data-act="untuck">
      ${sicon(sp.kind)}<div class="tb-tx"><b>${esc(agentOf(sp.agent).name)} ${verb}</b><span>${esc(firstLine(text))}</span></div></div>`;
  }
  if (S.strip) return stripHtml(list, live);
  const shown = list.slice(0, 4);
  const more = list.length - shown.length;
  return `<div class="tb" data-key="tab" data-enter="fade" data-drag data-act="untuck" data-tip="${esc(list.length ? `${d.nR} 进行中${d.nW ? ` · ${d.nW} 等你` : ''}` : '都安静着')}">
    <span class="logo">${IC.logo}</span>
    ${shown.length ? '<i class="tb-sep"></i>' : ''}
    ${shown.map(s => mini(s, live)).join('')}
    ${more > 0 ? `<span class="tb-more num">+${more}</span>` : ''}
  </div>`;
}

// 细条：贴边收起时只剩一根 8px 的条，每个任务一段、各用一种颜色，段里按完成比例填满；等你的那段闪橙色。
// 鼠标停上去（宿主调 tickStripHover）或按 Ctrl+Alt+← / →（tickCycle）时，条旁边长出当前任务的进度卡；点一下展开
const STRIP_COLORS = ['#4CB782', '#4EA7FC', '#8B7CF6', '#F472B6', '#F2B33D', '#2DD4BF'];
function stripHtml(list, live) {
  const shown = list.slice(0, 8);
  if (!shown.some(s => s.id === S.focusSid)) S.focusSid = shown[0]?.id || null;
  const pct = s => { const p = progress(s); return p.total ? p.done / p.total : s.status === 'done' ? 1 : 0; };
  const bar = `<span class="sb" style="--n:${Math.max(1, shown.length)}">${shown.length ? shown.map((s, i) => `<i class="sb-g${isWaiting(s) ? ' w' : ''}${s.id === S.focusSid ? ' on' : ''}" style="--c:${STRIP_COLORS[i % STRIP_COLORS.length]};--p:${(pct(s) * 100).toFixed(1)}%"></i>`).join('') : '<i class="sb-g idle"></i>'}</span>`;
  const s = (S.stripHover || S.stripPeek) && shown.find(x => x.id === S.focusSid);
  if (!s) return `<div class="tb strip" data-key="tab-strip" data-drag data-act="untuck">${bar}</div>`;
  const p = progress(s);
  const a = agentOf(s.agent);
  const i = shown.indexOf(s);
  const ticking = s.status === 'running' && !!current(s)?.startedAt && live();
  return `<div class="tb strip open" data-key="tab-strip" data-drag data-act="untuck" data-sid="${esc(s.id)}">${bar}
    <div class="sc" data-key="sc-${esc(s.id)}" data-enter="fade" style="--c:${STRIP_COLORS[i % STRIP_COLORS.length]}">
      <div class="sc-h">${sicon(isDormant(s) ? 'dormant' : s.status)}<b>${esc(s.title)}</b><span class="num">${p.total ? `${p.done}/${p.total}` : ''}</span></div>
      <div class="sc-s${ticking ? ' sweep' : ''}">${esc(firstLine(subline(s)))}</div>
      ${p.total ? segs(s, ticking) : ''}
      <div class="sc-m"><span class="tile sm" style="color:${a.color}">${esc(a.mark)}</span>${esc(a.name)}<i class="dot"></i><span class="num" data-clock="short" data-sid="${esc(s.id)}">${short(elapsed(s))}</span><span class="grow"></span>${shown.length > 1 ? `<span class="num">${i + 1}/${shown.length} · Ctrl+Alt+← →</span>` : ''}</div>
    </div></div>`;
}
window.tickStripHover = on => { S.stripHover = !!on; schedule(); };
// 全局快捷键切任务：收着时露出那个任务的卡 2.6 秒；展开着就在列表里定位它
let peekT = 0;
window.tickCycle = dir => {
  const list = [...floatData().active, ...floatData().stale];
  if (!list.length) return;
  const i = list.findIndex(s => s.id === S.focusSid);
  S.focusSid = list[(i + dir + list.length) % list.length].id;
  if (S.dock.tucked) {
    S.stripPeek = true;
    clearTimeout(peekT);
    peekT = setTimeout(() => { S.stripPeek = false; schedule(); }, 2600);
    schedule();
  } else focusSession(S.focusSid);
};

// 一个会话的小进度环：弧长 = 完成比例；中间的符号表示状态（等你 = 暂停、卡住 = 横杠、做完 = 对勾）
function mini(s, live) {
  const p = progress(s);
  const C = 2 * Math.PI * 7;
  const ticking = s.status === 'running' && !!current(s)?.startedAt && live();
  const center = {
    waiting: '<rect x="6.4" y="6" width="1.6" height="6" rx=".7" class="m-c"/><rect x="10" y="6" width="1.6" height="6" rx=".7" class="m-c"/>',
    blocked: '<rect x="5.8" y="8.2" width="6.4" height="1.6" rx=".7" class="m-c"/>',
    done: '<g transform="translate(2 2)"><circle class="ic-fill" cx="7" cy="7" r="6" fill="var(--green)"/><path class="ic-chk" d="M4.3 7.2l1.9 1.9 3.5-3.7" fill="none" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g>',
    failed: '<path d="M6.5 6.5l5 5M11.5 6.5l-5 5" class="m-x"/>',
  }[s.status] || '<circle cx="9" cy="9" r="1.6" class="m-c"/>';
  // 悬停提示：标题、进度、当前在做什么（系统提示框可以超出这个 30px 宽的小窗口）
  const step = current(s);
  const tip = `${agentOf(s.agent).name} · ${s.title}\n${STATUS[s.status]}${p.total ? ` · ${p.done}/${p.total}` : ''}${isWaiting(s) && s.statusNote ? `\n${firstLine(s.statusNote)}` : step ? `\n${EN ? 'Now: ' : '正在：'}${step.text}` : ''}`;
  return `<span class="mini ${s.status}${S.celebrate.has(s.id) ? ' celebrate' : ''}" data-key="m-${esc(s.id)}" data-sid="${esc(s.id)}" data-tip="${esc(tip)}" data-enter="fade" data-exit="fade">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <circle class="m-track" cx="9" cy="9" r="7"/>
      ${s.status === 'done' ? '' : `<circle class="m-arc" cx="9" cy="9" r="7" stroke-dasharray="${((p.total ? p.done / p.total : 0) * C).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 9 9)"/>`}
      ${ticking ? '<circle class="m-orbit" cx="9" cy="9" r="7" stroke-dasharray="3.5 40.5"/>' : ''}
      ${center}
    </svg></span>`;
}

// 收着时来了新消息：标签变成气泡。等你类一直显示到展开为止；其他类 6 秒后缩回
let speakTimer = 0;
function speakFor(n) {
  if (S.dnd) return; // 勿扰：只在环和橙线上体现，不弹气泡
  S.speak = n;
  clearTimeout(speakTimer);
  if (n.kind !== 'waiting' && n.kind !== 'blocked') speakTimer = setTimeout(() => { S.speak = null; schedule(); }, 6000);
}

// 一次性的事件挂载：滚动边缘、双击收起、原生窗口跟内容调尺寸
function wireFloat(el, mode) {
  el._wired = true;
  // 面板和标签来回换时 .f-body 会被换掉，滚动监听挂在根上用捕获拿
  el.addEventListener('scroll', e => {
    if (e.target.classList?.contains('f-body')) el.dataset.scrolled = e.target.scrollTop > 2 ? '1' : '';
  }, { passive: true, capture: true });
  el.addEventListener('dblclick', e => {
    if (!e.target.closest('[data-drag]') || e.target.closest('button,a')) return;
    toggleCompact();
  });
  if (mode === 'native') {
    // 胶囊悬停 480ms 才拉开：一扫而过不打扰，也给双击留出时间（双击是展开成完整面板）；
    // 按下过鼠标（单击、双击、开始拖）就不拉开，松手后重新计时。
    // 圆心钉在鼠标下面：先让宿主记住这一点在屏幕上的位置，之后报尺寸时带上圆心在页面里的位置，
    // 宿主把窗口摆到圆心正好落在那一点（fitAt）。
    // 窗口只改一次尺寸：先把窗口一步换到环形列表的大小，等它到位后再在页面里做动画。
    // 动画中途每帧改窗口尺寸会卡（窗口跟不上内容，实测一次卡 150ms 以上，圆圈几乎没有中间帧）
    let fanT = 0, mx = 150, fanFx = [], pressed = false;
    const box = () => el.firstElementChild;
    const FAN_DELAY = 480, FAN_MS = 380;
    el.addEventListener('pointermove', e => { if (!S.fan) mx = e.clientX; }, { passive: true });
    // 横条在页面里的矩形，换成圆心按钮（.fh）的 left/top/width/height 关键帧
    // fx/fy：横条左上角在 .fan 里的坐标
    const pillKey = f => ({ left: `${f.fx}px`, top: `${f.fy}px`, width: `${f.w}px`, height: `${f.h}px`, borderRadius: `${f.h / 2}px` });
    const hubKey = g => ({ left: `${g.hx - FAN.hub}px`, top: `${g.hy - FAN.hub}px`, width: `${FAN.hub * 2}px`, height: `${FAN.hub * 2}px`, borderRadius: `${FAN.hub}px` });
    // 横条缩成圆心 / 圆心变回横条：两头同时往鼠标那一点收（或从那一点往两头长），
    // 横条上的文字留在原处被收窄的边裁掉，前 40% 淡出（变回去时后 40% 淡入）
    const morphFan = open => {
      const f = S.fanFrom, g = S.fanGeo, fan = el.querySelector('.fan'), hub = fan?.querySelector('.fh');
      fanFx.forEach(a => a.cancel());
      fanFx = [];
      if (!f || !g || !fan || !hub || RM.matches) return null;
      const a = pillKey(f), b = hubKey(g);
      const opt = { duration: open ? FAN_MS : 300, easing: open ? 'cubic-bezier(.2,.8,.2,1)' : 'cubic-bezier(.4,0,.2,1)', fill: open ? 'none' : 'forwards' };
      hub.classList.add('morph');
      const ghost = f.ghost;
      if (ghost) {
        hub.prepend(ghost);
        // 文字钉在横条的原位置：按钮挪多少，文字就反方向挪多少（同一条缓动曲线，所以逐帧对得上）
        const dx = parseFloat(a.left) - parseFloat(b.left), dy = parseFloat(a.top) - parseFloat(b.top);
        const at = p => `translate(${(dx * p).toFixed(1)}px,${(dy * p).toFixed(1)}px)`;
        fanFx.push(ghost.animate(open
          ? [{ transform: at(0), opacity: 1 }, { transform: at(0.4), opacity: 0, offset: 0.4 }, { transform: at(1), opacity: 0 }]
          : [{ transform: at(1), opacity: 0 }, { transform: at(0.4), opacity: 0, offset: 0.6 }, { transform: at(0), opacity: 1 }], opt));
      }
      const main = hub.animate(open ? [a, b] : [b, a], opt);
      fanFx.push(main);
      main.finished.then(() => { if (open) { hub.classList.remove('morph'); ghost?.remove(); } }, () => {});
      return main;
    };
    // 回到横条：窗口先回原位，再取消钉住（顺序很重要：宿主按调用顺序执行）
    const fanRestore = () => {
      const f = S.fanFrom;
      if (!f) return;
      S.fanFrom = null;
      window.tickFitAt(f.w, f.h, f.mx, f.my);
      window.tickAnchor(-1, 0);
      window.tickClear?.(false);
    };
    S.fanRestore = fanRestore;
    el.addEventListener('pointerenter', e => {
      clearTimeout(fanT);
      mx = e.clientX;
      const closing = el.querySelector('.fan.closing');
      if (closing && !S.fanFrom) return; // 窗口已经在变回横条了：等它画完
      if (closing) { // 正在收：原路弹回来
        closing.classList.remove('closing');
        fanFx.forEach(a => a.cancel());
        fanFx = [];
        S.fanFrom?.ghost?.remove();
        closing.querySelector('.fh')?.classList.remove('morph');
        return;
      }
      pressed = false;
      armFan();
    });
    el.addEventListener('pointerdown', () => { pressed = true; clearTimeout(fanT); }, { passive: true });
    el.addEventListener('pointerup', () => { pressed = false; armFan(); }, { passive: true });
    function armFan() {
      clearTimeout(fanT);
      if (!S.compact || S.dock.tucked || S.fan || S.dragging) return;
      fanT = setTimeout(openFan, FAN_DELAY);
    }
    async function openFan() {
      const r = box().getBoundingClientRect();
      const from = { w: r.width, h: r.height, mx: Math.round(mx), my: Math.round(r.height / 2), sx: screenX, sy: screenY };
      const room = await window.tickAnchor(from.mx, from.my);
      // 等宿主回话时鼠标已经走了、按下了、或者双击展开了
      if (!el.matches(':hover') || !S.compact || S.fan || pressed || S.dragging) { window.tickAnchor(-1, 0); return; }
      const ghost = RM.matches ? null : box().querySelector(':scope > .f-in')?.cloneNode(true);
      if (ghost) {
        ghost.removeAttribute('data-key');
        ghost.classList.add('fh-ghost');
        Object.assign(ghost.style, { width: `${from.w}px`, height: `${from.h}px` });
      }
      S.fanFrom = { ...from, ghost, fx: 0, fy: 0 };
      S.fanRoom = room;
      S.fan = true;
      tipHide();
      window.tickClear?.(true); // 窗口变透明（没开毛玻璃时宿主不改，页面保留实底）
      render();
      const fan = el.querySelector('.fan'), hub = fan?.querySelector('.fh');
      if (!fan || !hub || RM.matches) return;
      // 窗口换尺寸之前：圆心按钮先扮成横条，直接放在新窗口里横条原来的位置（圆心在鼠标下，所以横条在
      // 圆心左上方 mx、my 处）。窗口还没换过来的那一两帧，小窗口里看不到它；换过来后正好对上，不会先跳到左上角。
      // 其余先藏着、入场动画先停着
      fan.classList.add('hold');
      const g = S.fanGeo;
      S.fanFrom.fx = g.hx - from.mx;
      S.fanFrom.fy = g.hy - from.my;
      const hold = hub.animate([pillKey(S.fanFrom), pillKey(S.fanFrom)], { duration: 1, fill: 'forwards' });
      hub.classList.add('morph');
      if (ghost) hub.prepend(ghost);
      // 等窗口换到新尺寸。贴着屏幕边、窗口被挤开时，按屏幕坐标重新对一次
      await settle(() => Math.abs(innerWidth - Math.ceil(g.W)) <= 2, 400, 0);
      if (!S.fan || S.fanFrom?.ghost !== ghost) { hold.cancel(); return; }
      const fb = fan.getBoundingClientRect();
      S.fanFrom.fx = from.sx - screenX - fb.left;
      S.fanFrom.fy = from.sy - screenY - fb.top;
      hold.effect.setKeyframes([pillKey(S.fanFrom), pillKey(S.fanFrom)]);
      // 窗口刚变大的那几帧会卡一下（实测 150ms 左右）：等帧率稳住再开始，动画才有完整的中间帧
      await settle(() => true, 300, 2);
      if (!S.fan || S.fanFrom?.ghost !== ghost) { hold.cancel(); return; }
      fan.classList.remove('hold');
      morphFan(true);
      hold.cancel();
    }
    // 一帧一帧等到 ok() 成立，再等 calm 个间隔正常（< 25ms）的帧；最多等 max 毫秒
    async function settle(ok, max, calm) {
      const t0 = performance.now();
      let last = t0, n = 0;
      while (performance.now() - t0 < max) {
        const t = await new Promise(requestAnimationFrame);
        if (ok()) { n = calm && t - last < 25 ? n + 1 : 0; if (n >= calm) return; }
        last = t;
      }
    }
    // 收起：卡片先淡掉、小圆收回圆心，圆心再往两头拉长回横条（文字淡回来），最后窗口一步变回横条大小
    const closeFan = () => {
      const fan = el.querySelector('.fan');
      // 先让窗口回到横条的位置和大小，到位后再画横条：反过来的话，横条会在大窗口的左上角闪一下
      const done = async () => {
        const w = S.fanFrom?.w;
        fanRestore();
        if (w && !RM.matches) await settle(() => Math.abs(innerWidth - Math.ceil(w)) <= 2, 300, 0);
        S.fan = false;
        render();
        if (el.matches(':hover')) armFan(); // 鼠标又回到了横条上：照常计时再拉开
      };
      if (!fan || RM.matches) return done();
      tipHide();
      fan.classList.add('closing');
      fanT = setTimeout(() => {
        const a = morphFan(false);
        if (!a) return done();
        a.finished.then(() => { if (el.querySelector('.fan.closing')) done(); }, () => {});
      }, 170);
    };
    el.addEventListener('pointerleave', () => {
      clearTimeout(fanT);
      if (S.fan) fanT = setTimeout(closeFan, 280);
    });
    // 键盘：上下键在任务之间移动（圆心在最后），回车打开，Esc 收起
    el.addEventListener('keydown', e => {
      if (!S.fan) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); clearTimeout(fanT); closeFan(); return; }
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      const os = [...el.querySelectorAll('.fan .fs, .fan .fh')];
      const i = os.indexOf(document.activeElement);
      os[(i + (e.key === 'ArrowDown' ? 1 : os.length - 1)) % os.length]?.focus();
    });
    let last = '';
    // 窗口尺寸 = 外层盒子的实际尺寸（标签、胶囊、面板宽度各不相同，变形动画中逐帧报告）；
    // 环形列表打开时连同圆心位置一起报
    new ResizeObserver(() => {
      const r = box().getBoundingClientRect();
      const w = Math.ceil(r.width);
      const h = Math.ceil(r.height);
      const at = S.fanFrom && el.querySelector('.fan-at')?.getBoundingClientRect();
      const key = `${w}x${h}${at ? `@${Math.round(at.left)},${Math.round(at.top)}` : ''}`;
      if (key === last) return;
      last = key;
      if (S.fanFrom) window.tickFitAt(w, h, at ? at.left : S.fanFrom.mx, at ? at.top : S.fanFrom.my);
      else window.tickFit(w, h);
    }).observe(box());
  }
}

// 收起 / 展开：窗口尺寸会跳，用一层很轻的模糊交叉淡入把跳变盖住
function toggleCompact() {
  S.fanRestore?.(); // 从环形列表点进来：窗口先回到横条原来的位置，再展开
  S.compact = !S.compact;
  S.histOpen = false;
  S.fan = false;
  if (NATIVE) window.tickCompact(S.compact); else store.set('compact', S.compact);
  const host = pip.root && document.hidden ? pip.root : root;
  // 交叉淡化分三段：旧内容留一份影子在原位淡出 → 盒子变形 → 新内容在变形后半段淡入。
  // 不留影子的话旧内容一帧就没了，新内容挤在还没长好的盒子里，像是直接跳到了终点
  const ghost = !RM.matches && host.firstElementChild?.querySelector(':scope > .f-in')?.cloneNode(true);
  render();
  const f = host.firstElementChild;
  if (!f || RM.matches) return;
  const fin = f.querySelector(':scope > .f-in');
  if (ghost) {
    ghost.classList.add('f-ghost');
    ghost.removeAttribute('data-key');
    f.appendChild(ghost);
    ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: 'ease-out', fill: 'forwards' }).finished.then(() => ghost.remove(), () => ghost.remove());
  }
  fin?.animate([{ opacity: 0, transform: `translateY(${S.compact ? 3 : -4}px)` }, { opacity: 1, transform: 'none' }],
    { duration: 200, delay: S.compact ? 140 : 110, easing: EASE_OUT, fill: 'backwards' });
}

// 胶囊（单行）轮流显示“进行中”分组里的每个会话，每 4 秒换一个（见下面的计时器），在等你的排在前面。
// 一行写：状态图标、会话标题、正在做的一步（等你时写问题）、进度。换会话时新的一行从下面淡入
const pillList = d => [...d.active.filter(isWaiting), ...d.active.filter(s => !isWaiting(s))];
function pillHtml(d, live) {
  const list = pillList(d);
  const s = list.find(x => x.id === S.pillSid) || list[0];
  if (!s) return `<span class="pill-tx" data-key="pill-q"><span class="tx t3">${d.recent.length || d.stale.length ? '没有进行中的会话' : '都安静着'}</span></span>`;
  S.pillSid = s.id;
  const p = progress(s);
  const step = current(s);
  const sub = isWaiting(s) ? firstLine(s.statusNote || '等你回复') : step ? step.text : subline(s);
  const ticking = s.status === 'running' && !!step && live();
  return `<span class="pill-tx" data-key="pill-${esc(s.id)}" data-enter="fade">${sicon(isDormant(s) ? 'dormant' : s.status)}
    <span class="tx"><b>${esc(s.title)}</b> <span class="${ticking ? 'sweep' : 't3'}" data-key="pill-step-${esc(step?.id || s.status)}">${esc(sub)}</span></span>
    ${p.total ? `<span class="p num"><span data-roll>${p.done}</span>/${p.total}</span>` : ''}${list.length > 1 ? `<span class="pill-dots" data-tip="${list.length} 个进行中，轮流显示">${list.slice(0, 6).map((x, i) => `<i${x === s || (i === 5 && list.indexOf(s) > 5) ? ' class="on"' : ''}></i>`).join('')}</span>` : ''}</span>`;
}

// 清单分模块时的段标题：模块名 + 这个模块勾了几项（悬浮窗、面板详情、卡片背面共用）。没分模块的条目不出标题
function modHead(s, g, tag = 'div', first = false) {
  // 模块之后回到不分模块的条目（多半是收尾的验证、提交）：只画一条分隔线，不然看着像还属于上一个模块
  if (!g) return first ? '' : `<${tag} class="it-g sep" data-key="g-sep" aria-hidden="true"></${tag}>`;
  const its = s.items.filter(x => (x.group || '') === g);
  const done = its.filter(finished).length;
  return `<${tag} class="it-g${done === its.length ? ' ok' : ''}" data-key="g-${esc(g)}"><span class="trunc">${esc(g)}</span><span class="num">${done}/${its.length}</span></${tag}>`;
}
// 长清单：悬浮窗里超过 8 条时只显示当前这一步前一条、后四条，前后各折成一行“前面 N 项已完成 / 后面还有 N 项”，
// 点一下展开全部，展开后底部有“只看当前附近”收回。面板详情里永远显示全部
const ITEMS_LONG = 8, ITEMS_WIN = 6;
function itemsHtml(s) {
  const all = s.items;
  const sid = esc(s.id);
  let from = 0, to = all.length;
  const long = FLOAT && all.length > ITEMS_LONG;
  if (long && !S.open.has(`all:${s.id}`)) {
    let c = all.findIndex(it => it.status === 'doing' || it.status === 'blocked');
    if (c < 0) c = all.findIndex(it => it.status === 'todo');
    if (c < 0) c = all.length - 1;
    from = Math.max(0, Math.min(c - 1, all.length - ITEMS_WIN));
    to = Math.min(all.length, from + ITEMS_WIN);
  }
  const head = all.slice(0, from);
  const fold = (key, label, icon) => `<button class="it-fold" data-act="items-all" data-sid="${sid}" data-key="${key}">${icon}<span>${label}</span></button>`;
  const doneBefore = head.filter(finished).length;
  const pre = from ? fold('fold-pre', doneBefore === from ? `前面 ${from} 项已完成` : `前面 ${from} 项（${doneBefore} 项已完成）`, `<span class="it-fold-ic ok">${sicon('done')}</span>`) : '';
  const post = to < all.length ? fold('fold-post', `后面还有 ${all.length - to} 项`, `<span class="it-fold-ic">${IC.chev}</span>`) : '';
  const back = long && S.open.has(`all:${s.id}`) ? fold('fold-back', '只看当前附近', `<span class="it-fold-ic up">${IC.chev}</span>`) : '';
  let g = null;
  return pre + all.slice(from, to).map(it => {
    const gh = (it.group || '') !== g ? (g === null ? (g = it.group || '', modHead(s, g, 'div', true)) : (g = it.group || '', modHead(s, g))) : '';
    const { ms, approx } = itemMs(s, it);
    const tm = it.status === 'todo' ? '' : it.status === 'skipped' ? '跳过' : `${approx ? '≈' : ''}${dur(ms)}`;
    // 悬停时右侧的耗时让位给两个小操作：复制这一条、跳过（已完成 / 已跳过的换成“恢复成待办”）
    const acts = `<span class="it-acts"><button class="ib" data-act="item-copy" data-tip="复制这一条">${IC.copy}</button>${it.status === 'skipped' || it.status === 'done'
      ? `<button class="ib" data-act="item-todo" data-tip="恢复成待办">${IC.undoArrow}</button>`
      : `<button class="ib" data-act="item-skip" data-tip="跳过这一条">${IC.skip}</button>`}</span>`;
    return `${gh}<div class="it-s ${it.status}${S.justDone.has(`${s.id}:${it.id}`) ? ' just' : ''}" data-key="${esc(it.id)}" data-sid="${esc(s.id)}" data-iid="${esc(it.id)}"><button class="it-tick" data-act="item-cycle" data-tip="${it.status === 'done' ? '取消勾选' : '手动勾上（agent 忘了勾时用）'}">${sicon(it.status)}</button><span class="tx">${esc(it.text)}${it.note ? `<span class="nt">${esc(it.note)}</span>` : ''}</span>
      <span class="tm num"${it.status === 'doing' && it.startedAt ? ` data-clock="item" data-sid="${esc(s.id)}" data-iid="${esc(it.id)}"` : ''}>${tm}</span>${acts}</div>`;
  }).join('') + post + back || `<div class="it-s"><span class="tx t3">${s.status === 'planning' ? '正在写清单…' : '没有清单'}</span></div>`;
}

function cardHtml(n) {
  const s = S.sessions.get(n.sessionId);
  const p = s ? progress(s) : null;
  const open = s && S.open.has(`card:${s.id}`);
  return `<div class="n-card${n.kind === 'blocked' ? ' blocked' : ''}" data-key="card-${esc(n.sessionId)}" data-enter="grow" data-exit data-nid="${esc(n.id)}">

    <div class="n-h">${sicon(n.kind)}<span>${esc(agentOf(n.agent).name)} ${n.kind === 'waiting' ? '在等你' : '卡住了'}</span><span class="when num" data-clock="ago" data-at="${n.at}">${ago(n.at)}</span></div>
    ${n.title ? `<button class="n-sub" data-act="card-toggle" data-sid="${esc(n.sessionId)}" aria-expanded="${!!open}"><span class="trunc">${esc(n.title)}</span>${p?.total ? `<span class="num">${p.done}/${p.total}</span>${IC.chev}` : ''}</button>` : ''}
    ${s && p.total ? `<div class="n-list${open ? ' open' : ''}"><div><div class="pad">${itemsHtml(s)}</div></div></div>` : ''}

function noticeRow(n) {
  const a = `<b>${esc(agentOf(n.agent).name)}</b>`;
  const t = n.title ? `「${esc(n.title)}」` : '';

// 子任务：主会话下面一行一个，左边一条竖线把它们和主会话连在一起。
// 平时只显示一行（状态 + 标题 + 当前步骤 + 进度），点开看它自己的清单
function kidsHtml(s, live) {
  const kids = childrenOf(s);
  if (!kids.length) return '';
  return `<div class="kids" data-flip>${kids.map(k => {
    const p = progress(k);
    const open = S.open.has(k.id);
    const ticking = !!current(k)?.startedAt && live();
    return `<div class="kid${open ? ' open' : ''}" data-key="kid-${esc(k.id)}" data-enter="grow" data-exit data-sid="${esc(k.id)}">
      <button class="kid-h" data-act="toggle" aria-expanded="${open}" data-tip="${esc(`${agentOf(k.agent).name} · ${k.title}`)}">
        ${sicon(k.status)}<span class="kid-t">${esc(k.title)}</span>
        <span class="kid-s${ticking ? ' sweep' : ''}" data-key="ks-${esc(current(k)?.id || k.status)}" data-enter="fade">${esc(firstLine(isEnded(k) ? STATUS[k.status] : subline(k)))}</span>
        <span class="kid-p num">${p.total ? `<span data-roll>${p.done}</span>/${p.total}` : ''}</span>
      </button>
      <div class="s-items"><div><div class="pad">${itemsHtml(k)}</div></div></div>
    </div>`;
  }).join('')}</div>`;
}

function sessionRow(s, live) {
  const a = agentOf(s.agent);
  const p = progress(s);
  const open = S.open.has(s.id);
  const ticking = (s.status === 'planning' || !!current(s)?.startedAt) && live();
  const step = current(s);
  const dead = isDormant(s);
  return `<div class="s${open ? ' open' : ''}${isEnded(s) ? ' ended' : ''}${dead ? ' dead' : ''}${S.celebrate.has(s.id) ? ' celebrate' : ''}" data-key="${esc(s.id)}" data-enter="grow" data-exit data-sid="${esc(s.id)}">
    <button class="s-head" data-act="toggle" aria-expanded="${open}">
      <span class="s-l1">${sicon(dead ? 'dormant' : s.status)}<span class="s-title">${esc(s.title)}</span><span class="s-prog num">${p.total ? `<span data-roll>${p.done}</span>/${p.total}` : ''}</span>${IC.chev}</span>
      <span class="s-l2"><span class="tile sm" data-tip="${esc(a.name)}">${esc(a.mark)}</span><span class="tx-wrap"><span class="tx${ticking ? ' sweep' : ''}" data-key="sub-${esc(step?.id || s.status)}" data-enter="fade">${esc(firstLine(subline(s)))}</span></span>
        ${isStale(s) && !dead ? (now() - alive(s) < 10 * MIN
          ? `<span class="stale live" data-tip="对话 ${short(now() - alive(s))} 前还有动静：agent 在干活，只是没报进度（比如在跑很长的命令）">${short(now() - s.updatedAt)} 没报进度 ·</span>`
          : `<span class="stale">${short(now() - s.updatedAt)} 没动静 ·</span>`) : ''}<span class="tm num" data-clock="short" data-sid="${esc(s.id)}">${short(elapsed(s))}</span></span>
      ${dead ? `<span class="s-why"><b class="num">${short(now() - s.updatedAt)}</b> 没有任何更新${alive(s) ? `，对话也 <b class="num">${short(now() - alive(s))}</b> 没动静：多半已经停了或窗口关了` : '：agent 多半被关了、丢了上下文，或者忘了收尾'}</span>` : ''}
      ${p.total && !isEnded(s) ? `<span class="segs-wrap">${segs(s, ticking)}</span>` : ''}
    </button>
    <div class="s-quick" data-key="q-${esc(s.id)}">
      ${s.link ? `<button class="ib" data-act="open-link" data-sid="${esc(s.id)}" data-tip="回到对话">${IC.link}</button>` : ''}
      <button class="ib" data-act="relay" data-sid="${esc(s.id)}" data-tip="复制接力提示：粘给任何 agent 都能接着做">${IC.copy}</button>
      <button class="ib" data-act="open-panel-session" data-sid="${esc(s.id)}" data-tip="在面板里看完整清单和动态">${IC.panel}</button>
      <button class="ib" data-act="archive" data-sid="${esc(s.id)}" data-tip="${isEnded(s) ? '归档' : '归档：在别处已经停了的会话从列表里拿走（agent 再报进度会自动回来）'}">${IC.archive}</button>
      ${dead ? `<button class="ib" data-act="end-session" data-sid="${esc(s.id)}" data-tip="结束：标成已取消（能撤销）">${IC.x}</button>` : ''}
    </div>
    ${kidsHtml(s, live)}
    <div class="s-items"><div><div class="pad">
      ${itemsHtml(s)}
      <div class="s-more">
        ${s.link ? `<button class="btn ghost" data-act="open-link" data-sid="${esc(s.id)}">${IC.link}回到对话</button>` : ''}
        <button class="btn ghost" data-act="relay" data-sid="${esc(s.id)}">${IC.copy}接力提示</button>
        <button class="btn ghost" data-act="open-panel-session" data-sid="${esc(s.id)}" data-tip="在面板里看完整清单、动态，可以编辑">${IC.panel}详情</button>
        ${dead ? `<button class="btn ghost" data-act="end-session" data-sid="${esc(s.id)}" data-tip="标成已取消；agent 回来接着做会自动恢复">${IC.x}结束</button>` : ''}
      </div>
    </div></div></div>
  </div>`;
}

// ======================================================================
// 面板
// ======================================================================
function groups() {
  // 有搜索词时：在全部会话里找（含已归档），不受当前视图限制
  const q = S.q.trim().toLowerCase();
  if (q) {
    const hits = [...S.sessions.values()].filter(s => matches(s, q)).sort(byUpdated);
    return [['搜索结果', hits.filter(s => !s.archived)], ['已归档里', hits.filter(s => s.archived)]];
  }
  const pool = [...S.sessions.values()].filter(s => (S.view === 'archived') === !!s.archived).filter(s => !S.agent || s.agent === S.agent);
  const by = f => pool.filter(f).sort(byUpdated);
  if (S.view === 'history') {
    // 历史：已结束的会话按结束那天分组，组头写当天做完几个、勾了几项、干活多久
    const ended = pool.filter(isEnded).sort((a, b) => b.endedAt - a.endedAt);
    const days = new Map();
    for (const s of ended) {
      const k = dayLabel(s.endedAt);
      if (!days.has(k)) days.set(k, []);
      days.get(k).push(s);
    }
    return [...days].map(([day, arr]) => {
      const ticked = arr.reduce((n, s) => n + s.items.filter(it => it.status === 'done').length, 0);
      const work = arr.reduce((n, s) => n + workMs(s), 0);
      const failed = arr.filter(s => s.status === 'failed').length;
      return [day, arr, `勾了 ${ticked} 项 · 干活 ${short(work)}${failed ? ` · ${failed} 个没做成` : ''}`];
    });
  }
  if (S.agent) return [['等你', by(isWaiting)], ['进行中', by(s => s.status === 'running' || s.status === 'planning')], ['已结束', by(isEnded)]];
  switch (S.view) {
    case 'waiting': return [['等你', by(isWaiting)]];
    case 'idle': return [['可能掉线了', by(isDormant), '30 分钟没有更新']];
    case 'all': return [['全部', by(() => true)]];
    case 'archived': return [['已归档', by(() => true)]];
    default: return [['等你', by(isWaiting)], ['进行中', by(s => s.status === 'running' && !isDormant(s))], ['写清单', by(s => s.status === 'planning' && !isDormant(s))],
      ['刚结束', by(s => isEnded(s) && now() - s.endedAt < 3 * 3600e3)], ['可能掉线了', by(isDormant)]];
  }
}
