      <button class="nav-i" data-act="pip">${IC.pip}<span class="grow">打开小窗</span></button>
      <button class="nav-i" data-act="guide">${IC.plug}<span class="grow">接入 agent</span></button>
      <button class="nav-i" data-act="theme">${S.theme === 'dark' ? IC.sun : IC.moon}<span class="grow">${S.theme === 'dark' ? '浅色' : '深色'}主题</span></button>
    </div>`);
  // 逆序：每组里的顺序倒过来；历史视图连“哪天在前”也倒过来
  const gs0 = groups().filter(g => g[1].length);
  const gs = S.order === 'old' ? (S.view === 'history' && !S.q.trim() ? gs0.reverse() : gs0).map(([h, arr, note]) => [h, [...arr].reverse(), note]) : gs0;
  const rows = gs.reduce((k, g) => k + g[1].length, 0);
  const t = itemsToday();
  const q = S.q.trim();
  // 搜索框只在第一次画出来，之后不再经过 morph，免得打字时光标被打断
  if (!$('top').querySelector('.search')) {
    $('top').innerHTML = tr(`<div class="crumb"></div><label class="search">${IC.search}<input id="q" type="search" placeholder="搜索标题、条目、备注、agent" autocomplete="off" spellcheck="false" aria-label="搜索"><kbd>/</kbd></label><span class="grow"></span><span class="top-r"></span>${WIN ? `<span class="wc"><button class="ib" data-act="win-min" data-tip="最小化">${IC.wMin}</button><button class="ib" data-act="win-max" data-tip="${document.documentElement.hasAttribute('data-max') ? '还原' : '最大化'}">${IC.wMax}${IC.wRes}</button><button class="ib wc-x" data-act="win-close" data-tip="关闭">${IC.x}</button></span>` : ''}`);
    $('q').addEventListener('input', e => { S.q = e.target.value; S.sel = null; schedule(); });
    $('q').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; S.q = ''; e.target.blur(); schedule(); } });
  }
  morph($('top').querySelector('.crumb'), q
    ? `<b>搜索</b><span class="t4 num" data-roll>${rows}</span>`
    : `<b>${S.agent ? esc(agentOf(S.agent).name) : VIEWS[S.view]}</b><span class="t4 num" data-roll>${S.agent || n[S.view] === undefined ? rows : n[S.view]}</span>`); // 和左侧导航同一个数
  morph($('top').querySelector('.top-r'), `${t ? `<span class="today num">今天勾了 ${t} 项</span>` : ''}
    <button class="btn ghost" data-act="deck" data-tip="全屏卡片：这个视图里每个会话一张，点一下翻面看清单（C）">${IC.cards}卡片</button>
    <button class="btn ghost" data-act="order" data-tip="${S.order === 'old' ? '现在最早的在前，点一下换成最新在前' : '现在最新的在前，点一下倒过来'}">${S.order === 'old' ? IC.sortUp : IC.sortDown}${S.order === 'old' ? '最早在前' : '最新在前'}</button>
    ${typeof window.tickFloat === 'function'
      ? `<button class="btn" data-act="float" data-tip="把桌面悬浮窗叫出来（Ctrl+Alt+T）">${IC.pip}悬浮窗</button>`
      : `<button class="btn" data-act="pip" data-tip="置顶小窗（Chrome / Edge 116+）">${IC.pip}打开小窗</button>`}`);
  const list = $('list');
  const keep = list.scrollTop;
  const viewKey = `${S.view}|${S.agent}|${q}`;
  if (viewKey !== list._view) list.replaceChildren(); // 换视图 / 换搜索词：瞬时替换，不播退场、不滚数字
  const ql = q.toLowerCase();
  const entered = morph(list, gs.length ? gs.map(([name, arr, note]) => `<div class="group-h" data-key="g-${esc(name)}" data-exit="fade"><span>${esc(tr(name))}</span><span class="cnt num" data-roll>${arr.length}</span>${note ? `<span class="g-note num">${esc(tr(note))}</span>` : ''}</div>${arr.map(s => {
    const a = agentOf(s.agent);
    const p = progress(s);
    const parent = s.parentId && S.sessions.get(s.parentId);
    // 副标题：搜索时显示命中的那一条；子任务标出属于哪个主会话；不活跃的写多久没动静
    const sub = (ql && hitLine(s, ql)) || (parent ? `↳ ${parent.title}` : isDormant(s) ? `${short(now() - s.updatedAt)} 没有更新 · ${firstLine(subline(s))}` : firstLine(subline(s)));
    return `<div class="row${S.sel === s.id ? ' sel' : ''}${S.celebrate.has(s.id) ? ' celebrate' : ''}${isDormant(s) ? ' dormant' : ''}" data-key="${esc(s.id)}" data-enter="fade" data-exit="fade" data-sid="${esc(s.id)}" data-act="select">${sicon(isDormant(s) ? 'dormant' : s.status)}<span class="tile" data-tip="${esc(a.name)}">${esc(a.mark)}</span>
      <span class="title">${esc(s.title)}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</span>
      <span class="prog num">${p.total ? `${ring(p.done / p.total)}${p.done}/${p.total}` : ''}</span><span class="time num" data-clock="short" data-sid="${esc(s.id)}" data-tip="${isEnded(s) ? `干活 ${dur(workMs(s))}` : '总耗时'}">${short(elapsed(s))}</span></div>`;
  }).join('')}`).join('') : panelEmpty());
  // 切换视图时整列换掉，瞬时完成；同一视图里新来的会话才淡入
  settle(viewKey === list._view ? entered : null);
  list._view = viewKey;
  list.scrollTop = keep;
  renderDetail();
  renderDeck();
}

// ---------- 全屏卡片：当前视图的会话铺成一桌牌，点一张翻到背面看清单 ----------
const DECK_MAX = 24;
const CARD_C = 2 * Math.PI * 34;
function deckCard(s) {
  const a = agentOf(s.agent);
  const p = progress(s);
  const pct = p.total ? p.done / p.total : 0;
  const tone = isWaiting(s) ? 'warn' : s.status === 'failed' ? 'bad' : isEnded(s) ? 'ok' : isDormant(s) ? 'idle' : 'run';
  const on = S.flipped.has(s.id);
  const sid = esc(s.id);
  return `<div class="card ${tone}${on ? ' flip' : ''}" data-key="c-${sid}" data-exit="fade" data-sid="${sid}" data-act="card-flip" tabindex="0" role="button" aria-pressed="${on}" aria-label="${esc(s.title)}">
    <div class="cd-in">
      <div class="cd-face cd-f">
        <div class="cd-top"><span class="tile">${esc(a.mark)}</span><span class="t3 trunc">${esc(a.name)}</span><span class="grow"></span><span class="cd-st">${sicon(isDormant(s) ? 'dormant' : s.status)}${STATUS[s.status]}</span></div>
        <div class="cd-ring"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="cr-bg" cx="40" cy="40" r="34"/><circle class="cr-v${pct ? '' : ' zero'}" cx="40" cy="40" r="34" stroke-dasharray="${(pct * CARD_C).toFixed(1)} ${CARD_C.toFixed(1)}" transform="rotate(-90 40 40)"/></svg>
          <b class="num">${p.total ? Math.round(pct * 100) : '–'}${p.total ? '<small>%</small>' : ''}</b></div>
        <h3 class="cd-t">${esc(s.title)}</h3>
        <p class="cd-s">${esc(isWaiting(s) && s.statusNote ? s.statusNote : firstLine(subline(s)))}</p>
        ${p.total ? segs(s, true) : ''}
        <div class="cd-ft num"><span>${p.done}/${p.total} 项</span><span class="grow"></span><span data-clock="short" data-sid="${sid}">${short(elapsed(s))}</span></div>
      </div>
      <div class="cd-face cd-b">
        <div class="cd-bh"><span class="cd-bt trunc">${esc(s.title)}</span><span class="num t4">${p.done}/${p.total}</span></div>
        <ol class="cd-list">${s.items.map((it, i, arr) => `${i === 0 || (arr[i - 1].group || '') !== (it.group || '') ? modHead(s, it.group || '', 'li', i === 0) : ''}<li class="${it.status}">${sicon(it.status)}<span>${esc(it.text)}${it.note ? `<small>${esc(it.note)}</small>` : ''}</span></li>`).join('')
          || `<li class="none">${s.status === 'planning' ? '正在写清单…' : '这个会话没有清单。'}</li>`}</ol>
        ${s.summary ? `<p class="cd-sum">${esc(s.summary)}</p>` : ''}
        <div class="cd-acts"><button class="btn" data-act="card-open" data-sid="${sid}">看详情</button>${s.link ? `<button class="btn ghost" data-act="open-link" data-sid="${sid}">${IC.link}回到对话</button>` : ''}</div>
      </div>
    </div></div>`;
}
function renderDeck() {
  const deck = $('deck');
  if (!S.deck) { deck.hidden = true; return; }
  const opening = deck.hidden;
  deck.hidden = false;
  const all = groups().flatMap(g => g[1]);
  const list = all.slice(0, DECK_MAX);
  const wait = list.filter(isWaiting).length;
  if (opening) deck.replaceChildren();
  const entered = morph(deck, `<header class="dk-h" data-drag><span class="logo">${IC.logo}</span><b>${S.agent ? esc(agentOf(S.agent).name) : VIEWS[S.view]}</b><span class="t4 num">${list.length}</span>
      ${wait ? `<span class="dk-w num">${wait} 个在等你</span>` : ''}<span class="grow"></span><span class="t4 dk-hint">点卡片翻面 · 方向键切换 · Esc 退出</span>
      <button class="ib" data-act="deck" data-tip="退出卡片（Esc）">${IC.x}</button></header>
    <div class="dk-grid">${list.length ? list.map(deckCard).join('') : '<div class="empty"><h2>这里没有会话</h2><p>换个视图再来铺卡片。</p></div>'}</div>
    ${all.length > list.length ? `<p class="dk-more t4">还有 ${all.length - list.length} 个没铺开，回列表里看</p>` : ''}`);
  // 发牌：新来的卡从下方带一点旋转飞进来，刚打开时一张接一张
  if (!RM.matches) entered.filter(n => n.classList?.contains('card')).forEach((el, k) => {
    const side = k % 2 ? 1 : -1;
    el.animate([{ transform: `translate(${side * 24}px, 70vh) rotate(${side * (6 + (k % 3) * 3)}deg) scale(.92)`, opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: 620, delay: opening ? Math.min(k, 12) * 45 : 0, easing: 'cubic-bezier(.2,.9,.25,1.08)', fill: 'backwards' });
  });
  if (opening) {
    if (!RM.matches) deck.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: EASE_OUT });
    requestAnimationFrame(() => deck.querySelector('.card')?.focus({ preventScroll: true }));
  }
}
// 进出卡片。原生面板窗口进来时替用户最大化，退出时还原（本来就是最大化的不动）；
// 浏览器里请求全屏，被拒（比如不是用户手势）也没关系，卡片照样盖满整个页面
function toggleDeck(on = !S.deck) {
  if (on === S.deck) return;
  if (WIN) {
    const max = document.documentElement.hasAttribute('data-max');
    if (on && !max) { S.deckMax = true; window.tickWin('max'); }
    if (!on && S.deckMax && max) window.tickWin('max');
    if (!on) S.deckMax = false;
  } else if (document.fullscreenEnabled) {
    if (on) document.documentElement.requestFullscreen().catch(() => {});
    else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }
  S.deck = on;
  if (on) { S.flipped.clear(); return schedule(); }
  const deck = $('deck');
  const done = () => { schedule(); document.querySelector('[data-act="deck"]')?.focus({ preventScroll: true }); };
  if (RM.matches) return done();
  deck.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.985)' }], { duration: 140, easing: 'ease-in' }).onfinish = done;
}
// 翻面：中途把牌往前抬一点再转过去，像从桌上拿起来翻
function flipCard(card) {
  const on = !S.flipped.has(card.dataset.sid);
  if (on) S.flipped.add(card.dataset.sid); else S.flipped.delete(card.dataset.sid);
  card.classList.toggle('flip', on);
  card.setAttribute('aria-pressed', String(on));
  // 背面清单直接滚到正在做的那条（没有就第一条没做的），前面勾完的往上收
  const list = card.querySelector('.cd-list');
  const cur = on && list.querySelector('li.doing, li.blocked, li.todo');
  if (cur) list.scrollTop = Math.max(0, cur.offsetTop - list.offsetTop - 34);
  if (RM.matches) return;
  card.querySelector('.cd-in').animate([{ transform: `rotateY(${on ? 0 : 180}deg)` }, { transform: 'translateZ(80px) rotateY(90deg) scale(1.05)', offset: 0.5 }, { transform: `rotateY(${on ? 180 : 0}deg)` }],
    { duration: 560, easing: 'cubic-bezier(.3,.7,.2,1)' });
}

function panelEmpty() {
  if (S.q.trim()) return `<div class="empty"><h2>没找到「${esc(S.q.trim())}」</h2><p>标题、条目、备注、总结、目录和 agent 名都搜过了，已归档的也算上了。换个词试试？</p></div>`;
  if (S.view === 'history') return '<div class="empty"><h2>还没有做完的会话</h2><p>agent 收尾之后会按天记在这里。</p></div>';
  if (S.view === 'idle') return '<div class="empty"><h2>没有掉线的会话</h2><p>说在跑、但 30 分钟没有更新的会话会放到这里，多半是 agent 被关了或者忘了收尾。</p></div>';
  if (S.view === 'waiting') return '<div class="empty"><h2>没有谁在等你</h2><p>agent 需要你拍板或动手时，会出现在这里，悬浮窗也会提醒。</p></div>';
  if (S.sessions.size) return '<div class="empty"><h2>这里是空的</h2><p>换个视图看看。</p></div>';
  return `<div class="empty"><h2>还没有 agent 来报到</h2><p>把 Tick 加进 agent 的 MCP 配置。它写下第一份清单，这里就会出现。</p>
    <div class="acts"><button class="btn primary" data-act="guide">${IC.plug}接入说明</button></div></div>`;
}

function renderDetail() {
  const s = S.sessions.get(S.sel);
  const detail = $('detail');
  $('body').classList.toggle('split', !!s);
  detail.hidden = !s;
  if (!s) return;
  const a = agentOf(s.agent);
  const p = progress(s);
  const live = sweeper();
  const keep = detail.dataset.sid === s.id ? detail.scrollTop : 0;
  const ws = s.workspace ? s.workspace.split(/[\\/]/).filter(Boolean).pop() : '';
  const evClass = t => (t === 'done' || t === 'item-done' ? 'ok' : t === 'waiting' ? 'warn' : /blocked|failed/.test(t) ? 'bad' : '');
  const same = detail.dataset.sid === s.id;
  if (!same) detail.replaceChildren(); // 换会话（含 J/K）：瞬时替换。各会话的条目 id 都是 i1、i2…，不清掉会被当成同一行复用并播过渡
  detail.dataset.sid = s.id;
  const entered = morph(detail, `
    <div class="d-bar"><span class="tile">${esc(a.mark)}</span><span class="t3">${esc(a.name)}</span>
      ${ws ? `<span class="t4">/</span><span class="t3 trunc" data-tip="${esc(s.workspace)}">${esc(ws)}</span>` : ''}<span class="grow"></span>
      ${s.link ? `<button class="btn ghost" data-act="open-link" data-sid="${esc(s.id)}">${IC.link}回到对话</button>` : ''}
      <button class="btn ghost" data-act="relay" data-sid="${esc(s.id)}">${IC.copy}接力提示</button>
      <button class="ib" data-act="archive" data-tip="${s.archived ? '取消归档' : '归档'}">${IC.archive}</button>
      <button class="ib del${S.confirmDel === s.id ? ' armed' : ''}" data-act="del-session" data-tip="${S.confirmDel === s.id ? '再点一次永久删除（连同子任务）' : '永久删除'}">${S.confirmDel === s.id ? '<span class="del-t">再点删除</span>' : IC.trash}</button>
      <button class="ib" data-act="close" data-tip="关闭（Esc）">${IC.x}</button></div>
    <div class="d-main">
      <div class="d-status">${sicon(s.status)}<span>${STATUS[s.status]}</span>${isStale(s) ? `<span class="t4">· ${short(now() - s.updatedAt)} 没有更新</span>` : ''}</div>
      ${S.editing === `title:${s.id}`
        ? `<input class="d-title-in" data-key="title-edit" data-edit="title" data-sid="${esc(s.id)}" value="${esc(s.title)}" maxlength="200" aria-label="会话标题">`
        : `<h1 class="d-title" data-key="title" data-act="edit-title" data-tip="双击改标题">${esc(s.title)}</h1>`}${s.goal ? `<p class="d-goal">${esc(s.goal)}</p>` : ''}
      ${isWaiting(s) ? `<div class="callout" data-key="callout" data-enter="grow" data-exit><div class="c-h">${sicon(s.status)}<span>${esc(a.name)} ${s.status === 'waiting' ? '在等你' : '卡住了'}</span><span class="t4 num" data-clock="waitnow" data-sid="${esc(s.id)}">${s.waitSince ? short(now() - s.waitSince) : ''}</span></div>
        <p class="c-b">${esc(s.statusNote || '它没写具体问题，回到对话看看。')}</p>
        <div class="c-a">${s.link ? `<button class="btn primary" data-act="open-link" data-sid="${esc(s.id)}">回到对话</button>` : ''}<button class="btn" data-act="relay" data-sid="${esc(s.id)}">${IC.copy}复制接力提示</button></div></div>` : ''}
      <dl class="facts">
        <dt>总耗时</dt><dd class="num" data-clock="elapsed" data-sid="${esc(s.id)}">${dur(elapsed(s))}</dd>
        <dt>开始</dt><dd class="num">${clock(s.createdAt)}${s.endedAt ? ` → ${clock(s.endedAt)}` : ''}</dd>
        <dt>干活</dt><dd class="num" data-clock="work" data-sid="${esc(s.id)}">${dur(elapsed(s) - waited(s))}</dd>
        <dt>等你</dt><dd class="num" data-clock="wait" data-sid="${esc(s.id)}">${dur(waited(s))}</dd>
        <dt>会话</dt><dd class="mono" data-tip="${esc(s.externalId)}">${esc(s.id)}${s.externalId ? ` · ${esc(s.externalId)}` : ''}</dd>
        <dt>更新</dt><dd class="num">${clock(s.updatedAt)}</dd>
      </dl>
      <section class="d-sec"><h3>清单 <span class="num t4"><span data-roll>${p.done}</span>/${p.total}</span></h3>
        ${p.total ? segs(s, true) : ''}
        ${p.total ? `<ol class="checklist">${s.items.map((it, i, arr) => {
          const gh = i === 0 || (arr[i - 1].group || '') !== (it.group || '') ? modHead(s, it.group || '', 'li', i === 0) : '';
          const { ms, approx } = itemMs(s, it);
          const ticking = it.status === 'doing' && it.startedAt;
          const tm = it.status === 'todo' ? '' : it.status === 'skipped' ? '跳过' : `${approx ? '≈' : ''}${dur(ms)}`;
          const editing = S.editing === `item:${s.id}:${it.id}`;
          return `${gh}<li data-key="${esc(it.id)}" data-enter="grow" data-exit class="it ${it.status}${S.justDone.has(`${s.id}:${it.id}`) ? ' just' : ''}" data-sid="${esc(s.id)}" data-iid="${esc(it.id)}">
            <button class="it-tick" data-act="item-cycle" data-tip="${it.status === 'done' ? '取消勾选' : '手动勾上'}" aria-label="${it.status === 'done' ? '取消勾选' : '勾上'}">${sicon(it.status)}</button><span class="n num">${i + 1}</span>
            <div class="it-body">${editing
              ? `<input class="it-in" data-edit="item" value="${esc(it.text)}" maxlength="300" aria-label="条目内容">`
              : `<div class="it-text${ticking && live() ? ' sweep' : ''}" data-act="edit-item" data-tip="双击修改">${esc(it.text)}</div>`}${it.note ? `<div class="it-note">${esc(it.note)}</div>` : ''}</div>
            <span class="it-time num"${ticking ? ` data-clock="item" data-sid="${esc(s.id)}" data-iid="${esc(it.id)}"` : ''}${approx ? ' data-tip="agent 没报开始时间，按上一条完成到这条完成估算"' : ''}>${tm}</span>
            <span class="it-acts"><button class="ib sm" data-act="edit-item" data-tip="修改">${IC.pencil}</button><button class="ib sm" data-act="del-item" data-tip="删掉这一条（可撤销）">${IC.trash}</button></span></li>`;
        }).join('')}</ol>` : `<p class="t3">${s.status === 'planning' ? '正在写清单…' : '这个会话没有清单。'}</p>`}
        <div class="it-add">${IC.plus}<input data-edit="add-item" data-sid="${esc(s.id)}" placeholder="添加一项，回车保存" maxlength="300" aria-label="添加条目"></div>
      </section>
      ${s.summary ? `<section class="d-sec"><h3>总结</h3><div class="summary">${esc(s.summary)}</div></section>` : ''}
      <section class="d-sec"><h3>动态</h3>${s.events.slice(-40).reverse().map(e => `<div class="ev" data-key="ev-${e.at}-${esc(e.type)}" data-enter="fade"><span class="d ${evClass(e.type)}"></span><span class="tx">${esc(evTr(e.text))}</span><span class="w num">${clock(e.at)}</span></div>`).join('')}</section>
    </div>`);
  // 同一个会话里新出现的条目、动态才动；换会话（含 J/K）瞬时替换
  settle(same && !S.detailFresh ? entered : null);
  if (S.detailFresh) { detail.classList.remove('in'); void detail.offsetWidth; detail.classList.add('in'); S.detailFresh = false; }
  detail.scrollTop = keep;
}

function openSession(id, byMouse) {
  const s = S.sessions.get(id);
  if (!s) return;
  if (FLOAT) { focusSession(id); return; }
  S.detailFresh = byMouse && !S.sel;
  S.sel = id;
  if (s.archived) S.view = 'archived';
  else if (S.view === 'archived' || !groups().some(g => g[1].includes(s))) { S.view = 'all'; S.agent = null; }
  history.replaceState(null, '', `${location.pathname}${location.search}#${id}`);
  schedule();
}
// 悬浮窗里：展开那个会话并滚过去
function focusSession(id) {
  // 收着时先展开，展开后再定位（tickDock 回调里接着做）
  if (NATIVE && S.dock.tucked) { S.focusAfter = id; window.tickUntuck(); return; }
  const s = S.sessions.get(id);
  S.open.add(id);
  if (s && isEnded(s)) S.histOpen = true; // 收起的“刚结束”里的会话：先把分组打开
  if (s && isWaiting(s)) S.open.add(`card:${id}`); // 抽屉里的卡片也展开清单
  render();
  const host = pip.root || root;
  // 先找主列表里的行（等你的会话也在列表里），找不到再找抽屉里的卡片
  const el = host.querySelector(`.f-body .kid[data-sid="${CSS.escape(id)}"], .f-body .s[data-sid="${CSS.escape(id)}"]`) || host.querySelector(`.n-card[data-key="card-${CSS.escape(id)}"]`);
  el?.scrollIntoView({ block: 'nearest' });
  // 轻轻提示一下是哪一行
  if (el && !RM.matches) el.animate([{ backgroundColor: 'color-mix(in srgb, var(--accent) 14%, transparent)' }, { backgroundColor: 'transparent' }], { duration: 900, easing: EASE_OUT });
}
window.tickFocus = focusSession;
// 宿主告诉页面停靠状态：贴着哪条边、是否收起。收起时露在外面的窄边由 CSS 画
window.tickDock = (edge, tucked) => {
  S.dock = { edge: edge || '', tucked: !!tucked };
  root.dataset.dock = S.dock.edge;
  root.dataset.scrolled = ''; // 面板会重建，新的列表在顶部
  if (!tucked) S.speak = null; // 展开了就是看到了，气泡不用再说
  if (tucked) { S.histOpen = false; S.staleOpen = false; S.drawer = false; S.agentsOpen = false; S.fan = false; S.fanRestore?.(); } // 收起来时顺手把临时展开的都收回去
  setIdle();
  render();
  if (!tucked && S.focusAfter) {
    const id = S.focusAfter;
    S.focusAfter = null;
    setTimeout(() => focusSession(id), 260); // 等面板长出来再定位
  }
};
// 收到托盘：先缩一点、淡出、往托盘方向沉一点，再让宿主隐藏。退场比进场快
window.tickLeave = () => {
  const f = root.firstElementChild;
  if (!f || RM.matches) { window.tickHide(); return; }
  f.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(6px) scale(.97)' }],
    { duration: 150, easing: EASE_OUT, fill: 'forwards' }).onfinish = a => {
    window.tickHide();
    a.target.cancel(); // 下次显示时回到正常样子
  };
};
// 从托盘叫回来：轻轻浮上来
window.tickAppear = () => {
  const f = root.firstElementChild;
  if (!f || RM.matches) return;
  f.animate([{ opacity: 0, transform: 'translateY(6px) scale(.97)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: EASE_OUT });
};
window.tickHostState = st => {
  if ('pinned' in st) S.pinned = st.pinned;
  if ('dnd' in st) S.dnd = st.dnd;
  if ('side' in st) S.side = st.side === 'left' ? 'left' : 'right';
  if ('vside' in st) S.vside = st.vside === 'bottom' ? 'bottom' : 'top';
  if ('sound' in st) S.sound = st.sound || '';
  if ('theme' in st) setTheme(st.theme);
  if ('strip' in st) S.strip = !!st.strip;
  if ('toastLen' in st) S.toastLen = st.toastLen;
  if ('glass' in st) document.documentElement.toggleAttribute('data-glass', !!st.glass);
  if (Array.isArray(st.sounds)) S.sounds = st.sounds;
  schedule();
};


// ============ 置顶小窗（浏览器 Document PiP） ============
const pip = { win: null, root: null };
async function openPip() {
  if (pip.win) { pip.win.focus(); return; }
  if (!('documentPictureInPicture' in window)) {
    window.open(`${location.pathname}?view=mini`, 'tick-mini', 'popup,width=340,height=520');
    toast('这个浏览器不支持置顶小窗，先用普通小窗口打开了。Chrome / Edge 116 以上可以置顶。');
    return;
  }
  try {
    const win = await documentPictureInPicture.requestWindow({ width: 340, height: 520 });
    // 用新文档里创建的 style 元素承载样式，跨文档克隆的节点在 PiP 里可能不生效
    const style = win.document.createElement('style');
    style.textContent = $('tick-css').textContent;
    win.document.head.append(style);
    applyTheme(win.document);
    win.document.title = 'Tick';
    win.document.body.style.margin = '0';
    const el = win.document.createElement('div');
    win.document.body.append(el);
    el.addEventListener('click', onClick);
    el.addEventListener('pointermove', scrub, { passive: true });
    tipWire(win.document);
    win.setInterval(() => tickClocks(el), 1000); // 小窗自己的计时器，主标签页隐藏时也准
    win.addEventListener('pagehide', () => { pip.win = null; pip.root = null; });
    pip.win = win;
    pip.root = el;
    render();
  } catch (err) {
    toast(`小窗没打开：${esc(err.message)}`);
  }
}

// ============ 提示、复制、接入说明 ============
function toast(html, opt = {}) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = tr(`<span>${html}</span>${opt.action ? `<button class="toast-act">${esc(tr(opt.action))}</button>` : ''}`);
  const close = () => { el.dataset.state = 'leave'; setTimeout(() => el.remove(), 220); };
  if (opt.action) el.querySelector('button').addEventListener('click', () => { opt.onAction(); close(); });
  $('toasts').append(el);
  while ($('toasts').children.length > 3) $('toasts').firstElementChild.remove();
  requestAnimationFrame(() => requestAnimationFrame(() => { el.dataset.state = 'show'; }));
  setTimeout(close, opt.ms || 4200);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}
function relayText(s) {
  const p = progress(s);
  const step = current(s) || s.items.find(it => it.status === 'todo');
  return `继续 Tick 会话 ${s.id}（${s.title}）。现在${STATUS[s.status]}，清单 ${p.done}/${p.total}` +
    `${step ? `，下一步 #${s.items.indexOf(step) + 1} ${step.text}` : ''}${isWaiting(s) && s.statusNote ? `。上次停在：${s.statusNote}` : ''}。` +
    `先用 tick_show（session_id=${s.id}）看清单，再按 Tick 的要求接着勾选。`;
}
function guideConfigs() {
  const mcp = S.info.mcp || `${BASE}/mcp`;

  return [
    ['Claude Code', `claude mcp add --transport http tick ${mcp}`],

    ['Codex（~/.codex/config.toml）', `[mcp_servers.tick]\nurl = "${mcp}"`],

  ];
}

async function openGuide() {

// ============ 交互 ============
async function onClick(e) {
  const el = e.target.closest('[data-act],[data-view],[data-agent],.n-row');
  if (!el) return;
  const act = el.dataset.act;
  const sid = el.dataset.sid || el.closest('[data-sid]')?.dataset.sid;
  const s = S.sessions.get(sid) || S.sessions.get(S.sel);
  if (!act && el.dataset.view) { S.view = el.dataset.view; S.agent = null; return schedule(); }
  if (!act && el.dataset.agent !== undefined) { S.agent = S.agent === el.dataset.agent ? null : el.dataset.agent; return schedule(); }
  switch (act) {
    case undefined: // 通知行：标已读，回主面板展开对应会话
      markRead([el.dataset.nid]);
      if (FLOAT) { S.drawer = false; S.drawerAuto = false; S.fresh = new Set(); }
      if (sid) focusSession(sid); else schedule();
      break;
    case 'select': openSession(sid, true); break;
    case 'deck': toggleDeck(); break;
    case 'card-flip': flipCard(el); break;
    case 'card-open': toggleDeck(false); openSession(sid, true); break;
    case 'close': S.sel = null; history.replaceState(null, '', location.pathname + location.search); schedule(); break;
    case 'toggle': {
      const row = el.closest('.kid, .s'); // 子任务行和会话行都能就地展开
      const open = !S.open.has(sid);
      if (open) S.open.add(sid); else S.open.delete(sid);
      row.classList.toggle('open', open); // 就地切换，保留展开过渡
      el.setAttribute('aria-expanded', String(open));
      break;
    }
    case 'read':
      e.stopPropagation();
      if (el.dataset.nid) markRead([el.dataset.nid]);
      else if (s) { S.dismissed.add(`${s.id}:${s.waitSince}`); schedule(); } // 通知还没到的卡片：只在本地收起
      break;
    case 'read-all': // 全部看过了就没必要留着抽屉
      markRead(S.notices.filter(n => !n.read).map(n => n.id));
      S.drawer = false; S.drawerAuto = false; S.fresh = new Set();
      schedule();
      break;
    // ---------- 悬浮窗：抽屉、排序、刚结束、底栏动态、转盘、提示音 ----------
    case 'drawer': {
      S.drawer = !S.drawer;
      S.drawerAuto = false; // 自己打开的抽屉不会自动收起
      // 打开就算看过了：未读全部标成已读（角标、外框呼吸、托盘闪动一起停）；
      // 这次打开期间它们仍留在“未读”页签里，关掉抽屉后才归到“全部”
      const ids = S.drawer ? S.notices.filter(n => !n.read).map(n => n.id) : [];
      S.fresh = new Set(ids);
      if (S.drawer) S.agentsOpen = false;
      if (S.drawer && !ids.length) S.drawerTab = 'all'; // 没有未读就直接看全部
      if (ids.length) { S.drawerTab = 'unread'; markRead(ids); } else schedule();
      break;
    }
    case 'clear-notices': {
      const before = S.notices;
      S.notices = [];
      S.fresh = new Set();
      schedule();
      try { await post('/api/notices', {}, 'DELETE'); } catch (err) { S.notices = before; schedule(); toast(`没清掉：${esc(err.message)}`); }
      break;
    }
    case 'dtab': S.drawerTab = el.dataset.tab; schedule(); break;
    case 'order': S.order = S.order === 'old' ? 'new' : 'old'; store.set('order', S.order); schedule(); break;
    case 'hist': S.histOpen = !S.histOpen; schedule(); break;
    case 'item-copy': {
      e.stopPropagation();
      const it = s?.items.find(x => x.id === el.closest('[data-iid]')?.dataset.iid);
      if (it) toast(await copy(it.note ? `${it.text}\n${it.note}` : it.text) ? '已复制这一条' : '复制没成功');
      break;
    }
    case 'item-skip': case 'item-todo': {
      e.stopPropagation();
      const iid = el.closest('[data-iid]')?.dataset.iid;
      if (!s || !iid) break;
      try { await post(`/api/sessions/${s.id}/items/${iid}`, act === 'item-skip' ? { status: 'skipped', note: '手动跳过' } : { status: 'todo' }, 'PATCH'); }
      catch (err) { toast(`没改成：${esc(err.message)}`); }
      break;
    }
    case 'items-all': {
      e.stopPropagation();
      const k = `all:${sid}`;
      if (S.open.has(k)) S.open.delete(k); else S.open.add(k);
      schedule();
      break;
    }
    case 'agents': S.agentsOpen = !S.agentsOpen; if (S.agentsOpen) S.drawer = false; schedule(); break;
    case 'agent-go': S.agentsOpen = false; if (sid) focusSession(sid); else schedule(); break;
    case 'fan-open': case 'fan-more': case 'fan-hub':
      S.fan = false;
      toggleCompact();
      if (sid) setTimeout(() => focusSession(sid), 220); // 等面板长出来再定位
      break;
    case 'sound-test': window.tickSound(S.sound); break;
    case 'sound-dir': window.tickSoundDir(); break;
    case 'open-link':
      // 本地面板窗口里也有 tickOpen（交给系统默认程序打开）
      if (s?.link) typeof window.tickOpen === 'function' ? window.tickOpen(s.link).catch(err => toast(esc(String(err)))) : (location.href = s.link);
      break;
    case 'relay': if (s) toast(await copy(relayText(s)) ? '接力提示已复制，粘给任何 agent 都能接着做' : '复制没成功'); break;
    case 'copy-mcp': toast(await copy(S.info.mcp || `${BASE}/mcp`) ? 'MCP 地址已复制' : '复制没成功'); break;
    case 'copy-cfg': toast(await copy(guideConfigs()[Number(el.dataset.i)][1]) ? '已复制' : '复制没成功'); break;
    case 'copy-skill-path': toast(await copy(S.skills.skills[Number(el.dataset.i)].path) ? '路径已复制' : '复制没成功'); break;
    case 'copy-skill-prompt': toast(await copy(skillPrompt()) ? '安装提示已复制，粘给 agent 就行' : '复制没成功'); break;
    case 'copy-skill-body': {
      const text = await fetch('/skill').then(r => r.text(), () => '');
      toast(text && await copy(text) ? '技能全文已复制' : '复制没成功');
      break;
    }
    case 'skill-update': {
      el.disabled = true;
      try {
        const r = await fetch('/api/skills', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); // 接口要求 JSON（防跨站表单）
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
        S.skills = { ...S.skills, skills: d.skills };
        toast(`已写入 ${d.updated} 个文件；已经开着的 agent 新开对话后生效`);
      } catch (err) { toast(`没写进去：${esc(err.message)}`); }
      openGuide();
      break;
    }
    case 'guide': openGuide(); break;
    case 'close-guide': closeGuide(); break;
    case 'pip': typeof window.tickFloat === 'function' ? window.tickFloat() : openPip(); break;
    case 'float': window.tickFloat(); break;
    case 'win-min': window.tickWin('min'); break;
    case 'win-max': window.tickWin('max'); break;
    case 'win-close': window.tickWin('close'); break;
    case 'panel': NATIVE ? window.tickPanel('') : window.open(`${BASE}/`, 'tick-main'); break;
    case 'open-panel-session': NATIVE ? window.tickPanel(`#${sid}`) : window.open(`${BASE}/#${sid}`, 'tick-main'); break;
    case 'ctx-delete-ok':
      if (sid) try { await post(`/api/sessions/${sid}`, {}, 'DELETE'); } catch (err) { toast(`没删成：${esc(err.message)}`); }
      break;
    case 'hide': window.tickLeave(); break;
    case 'untuck': {
      // 拖过的不算点击（按下和松开距离超过 4px）
      const moved = S.downAt && Math.hypot(e.screenX - S.downAt[0], e.screenY - S.downAt[1]) > 4;
      if (moved) break;
      // 点在某个会话的环上：展开并直接打开那个会话；点在别处：只展开
      const ring = e.target.closest('.mini[data-sid], .strip.open[data-sid]');
      if (ring) { S.stripHover = S.stripPeek = false; focusSession(ring.dataset.sid); }
      else if (S.speak?.sessionId) focusSession(S.speak.sessionId);
      else window.tickUntuck();
      break;
    }
    case 'dnd': S.dnd = await window.tickDnd(!S.dnd); schedule(); break;
    // ---------- 增删改 ----------
    case 'item-cycle': {
      e.stopPropagation();
      const iid = el.closest('[data-iid]')?.dataset.iid;
      const it = s?.items.find(x => x.id === iid);
      if (!it) break;
      const to = it.status === 'done' || it.status === 'skipped' ? 'todo' : 'done';
      try { await post(`/api/sessions/${s.id}/items/${iid}`, { status: to }, 'PATCH'); }
      catch (err) { toast(`没改成：${esc(err.message)}`); }
      break;
    }
    case 'edit-title': if (e.detail >= 2 || el.tagName === 'BUTTON') startEdit(`title:${s.id}`); break;
    case 'edit-item': {
      const iid = el.closest('[data-iid]')?.dataset.iid;
      if (iid && (e.detail >= 2 || el.tagName === 'BUTTON')) startEdit(`item:${s.id}:${iid}`);
      break;
    }
    case 'del-item': {
      const iid = el.closest('[data-iid]')?.dataset.iid;
      const it = s?.items.find(x => x.id === iid);
      if (!it) break;
      const before = s.items.map(x => ({ text: x.text, status: x.status, note: x.note || '' }));
      try {
        await post(`/api/sessions/${s.id}/items/${iid}`, {}, 'DELETE');
        // 撤销：把原清单按原顺序重发一遍；文字相同的条目保留现状，被删的那条按原状态补回
        toast(`删掉了「${esc(it.text)}」`, { action: '撤销', onAction: () => post(`/api/sessions/${s.id}/items`, { items: before }, 'PUT').catch(err => toast(esc(err.message))), ms: 6000 });
      } catch (err) { toast(`没删成：${esc(err.message)}`); }
      break;
    }
    case 'del-session': {
      // 永久删除不能撤销：第一次点只是“上膛”，3 秒内再点一次才删
      if (S.confirmDel !== s.id) {
        S.confirmDel = s.id;
        schedule();
        setTimeout(() => { if (S.confirmDel === s.id) { S.confirmDel = null; schedule(); } }, 3000);
        break;
      }
      S.confirmDel = null;
      try {
        const title = s.title;
        await post(`/api/sessions/${s.id}`, {}, 'DELETE');
        S.sel = null;
        toast(`已删除「${esc(title)}」`);
      } catch (err) { toast(`没删成：${esc(err.message)}`); }
      schedule();
      break;
    }
    case 'archive-ended': {
      // 只清“刚结束”里那些主会话，连同它们的子任务；还在跑的主会话下面已结束的子任务不动

function scrub(e) {
  const doc = e.target.ownerDocument || document;
  const bar = e.target.closest?.('.segs-wrap')?.querySelector('.segs,.pbar') || e.target.closest?.('.segs,.pbar');

  const seg = bar.classList.contains('segs') ? bar.children[i] : null;

  if (!tip) {

  const { ms, approx } = itemMs(s, it);
  const tm = it.status === 'todo' ? '' : it.status === 'skipped' ? '跳过' : `${approx ? '≈' : ''}${dur(ms)}`;
  const key = `${s.id}:${it.id}:${it.status}:${tm}`;

    tip.innerHTML = tr(`<b>${sicon(it.status)}#${i + 1} ${esc(ITEM[it.status] || '')}<span class="st num">${esc(tr(tm))}</span></b><span>${esc(it.text)}</span>${it.note ? `<span class="nt">${esc(firstLine(it.note))}</span>` : ''}`);

  const y = r.top - h - 8 < 4 ? r.bottom + 8 : r.top - h - 8;

  doc.addEventListener('pointerdown', e => { if (pk.el && !pk.el.contains(e.target) && !pk.btn?.contains(e.target)) pickClose(); }, true);
  doc.addEventListener('keydown', e => {
    if (!pk.el) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); pickClose(true); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const os = [...pk.el.querySelectorAll('.pk-o')];
      const i = os.indexOf(doc.activeElement);
      os[(i + (e.key === 'ArrowDown' ? 1 : -1) + os.length) % os.length]?.focus();
    }
  }, true);
  doc.addEventListener('scroll', e => { if (pk.el && !pk.el.contains(e.target)) pickClose(); }, { capture: true, passive: true });
  doc.defaultView.addEventListener('blur', () => pickClose());
}

// ============ 自绘提示框（替代原生 title 提示） ============
// 带 data-tip 的元素悬停 450ms 后在下方（放不下就上方）出现；刚看过一个提示，挪到旁边的按钮立刻出
const uiTips = new WeakMap();
const tipSt = { t: 0, el: null, last: 0 };
function tipHide() {
  clearTimeout(tipSt.t);
  const doc = tipSt.el?.ownerDocument;
  tipSt.el = null;
  if (doc) { const tip = uiTips.get(doc); if (tip?.classList.contains('on')) { tip.classList.remove('on'); tipSt.last = Date.now(); } }
}
function tipShow(t) {
  if (!t.isConnected || tipSt.el !== t || pk.el) return;
  const doc = t.ownerDocument, view = doc.defaultView;
  let tip = uiTips.get(doc);
  if (!tip) {
    tip = doc.createElement('div');
    tip.className = 'ui-tip';
    tip.setAttribute('role', 'tooltip');
    doc.body.appendChild(tip);
    uiTips.set(doc, tip);
  }
  tip.textContent = t.dataset.tip;
  const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const x = Math.max(6, Math.min(view.innerWidth - w - 6, r.left + r.width / 2 - w / 2));
  const y = r.bottom + 6 + h > view.innerHeight - 4 ? r.top - h - 6 : r.bottom + 6;
  tip.style.left = `${Math.round(x)}px`;
  tip.style.top = `${Math.round(Math.max(4, y))}px`;
  tip.classList.add('on');
}
function tipWire(doc) {
  doc.addEventListener('pointerover', e => {
    const t = e.target.closest?.('[data-tip]');
    if (t === tipSt.el) return;
    tipHide();
    if (!t || !t.dataset.tip || e.pointerType === 'touch') return;
    tipSt.el = t;
    tipSt.t = setTimeout(() => tipShow(t), Date.now() - tipSt.last < 400 ? 0 : 450);
  }, { passive: true });
  for (const ev of ['pointerdown', 'keydown', 'wheel']) doc.addEventListener(ev, tipHide, { capture: true, passive: true });
  doc.addEventListener('scroll', tipHide, { capture: true, passive: true });
  doc.documentElement.addEventListener('pointerleave', tipHide);
}
pickWire(document);
tipWire(document);
// 抽屉里的提示音下拉：选了就交给宿主保存并试听一次
PICK.sound = v => {
  S.sound = v;
  if (typeof window.tickSound === 'function') window.tickSound(v);
  schedule();
};
document.addEventListener('scroll', () => tips.get(document)?.classList.remove('on'), { capture: true, passive: true });

// 面板：双击标题栏最大化 / 还原，和系统标题栏一样
document.addEventListener('dblclick', e => {
  if (WIN && !e.target.closest('button,a,input,label') && dragZone(e.target)) window.tickWin('max');
});
// 卡片跟着鼠标微微倾斜，高光落在鼠标那一侧；只动鼠标下那一张
let tiltCard = null;
document.addEventListener('pointermove', e => {
  if (!S.deck || RM.matches) return;
  const c = e.target.closest('.card');
  if (tiltCard && tiltCard !== c) ['--rx', '--ry', '--mx', '--my'].forEach(k => tiltCard.style.removeProperty(k));
  tiltCard = c;
  if (!c) return;
  const r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;
  const y = (e.clientY - r.top) / r.height - 0.5;
  c.style.setProperty('--rx', `${(-y * 8).toFixed(2)}deg`);
  c.style.setProperty('--ry', `${(x * 10).toFixed(2)}deg`);
  c.style.setProperty('--mx', `${((x + 0.5) * 100).toFixed(1)}%`);
  c.style.setProperty('--my', `${((y + 0.5) * 100).toFixed(1)}%`);
}, { passive: true });
// 浏览器里按 Esc 退出全屏时页面收不到按键，跟着把卡片收掉
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && S.deck && !WIN) toggleDeck(false); });
window.tickWinState = st => {
  document.documentElement.toggleAttribute('data-max', !!st.max);
  const b = document.querySelector('[data-act="win-max"]');
  if (b) b.dataset.tip = tr(st.max ? '还原' : '最大化');
};
if (WIN) window.tickWin('state');
// 关掉接入说明时把地址里的 #guide 去掉，下次从悬浮窗 / 别的标签页再跳过来才会重新打开
function closeGuide() {
  $('guide').hidden = true;
  if (location.hash === '#guide') history.replaceState(null, '', location.pathname + location.search);
}
$('guide').addEventListener('mousedown', e => { if (e.target === $('guide')) closeGuide(); });
document.addEventListener('keydown', e => {
  // 卡片开着：方向键在牌之间走（上下按一行几张跳），回车 / 空格翻面，Esc 退出
  if (S.deck && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.key === 'Escape') { toggleDeck(false); return; }
    const cards = [...$('deck').querySelectorAll('.card:not([data-leaving])')];
    const at = cards.indexOf(document.activeElement);
    if ((e.key === 'Enter' || e.key === ' ') && at >= 0) { e.preventDefault(); flipCard(cards[at]); return; }
    const cols = cards.filter(c => c.offsetTop === cards[0]?.offsetTop).length || 1;
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols }[e.key];
    if (step && cards.length) {
      e.preventDefault();
      cards[Math.min(Math.max(at < 0 ? 0 : at + step, 0), cards.length - 1)].focus();
    }
    return;
  }
  if (e.key === 'Escape') {
    if (!$('guide').hidden) closeGuide();
    else if (S.agentsOpen) { S.agentsOpen = false; schedule(); }
    else if (S.drawer) { S.drawer = false; schedule(); }
    else if (S.sel) { S.sel = null; schedule(); }
    return;
  }
  if (FLOAT || e.target.matches('input,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const ids = groups().flatMap(g => g[1].map(s => s.id));
  if (e.key === '/' && $('q')) { e.preventDefault(); $('q').focus(); $('q').select(); return; }
  if (e.key === 'c' && $('deck')) { toggleDeck(true); return; }
  if ((e.key === 'j' || e.key === 'k') && ids.length) {
    const at = ids.indexOf(S.sel);
    openSession(ids[Math.min(Math.max(at + (e.key === 'j' ? 1 : -1), 0), ids.length - 1)], false); // 键盘切换不做动画
  }
});

// ============ 计时 ============
function tickClocks(host) {
  host.querySelectorAll('[data-clock]').forEach(el => {
    const k = el.dataset.clock;
    let v = '';
    if (k === 'ago') v = ago(Number(el.dataset.at));
    else {
      const s = S.sessions.get(el.dataset.sid);
      if (!s) return;
      if (k === 'short') v = short(elapsed(s));
      else if (k === 'elapsed') v = dur(elapsed(s));
      else if (k === 'work') v = dur(elapsed(s) - waited(s));
      else if (k === 'wait') v = dur(waited(s));
      else if (k === 'waitnow') v = s.waitSince ? short(now() - s.waitSince) : '';
      else if (k === 'item') { const it = s.items.find(x => x.id === el.dataset.iid); v = it ? dur(spent(it)) : ''; }
    }
    if (el.textContent !== v) el.textContent = v;
  });
}
// 省电：看不见的时候（窗口隐藏 / 收到托盘 / 收成标签且没有会话在跑 / 浏览器标签页在后台）
// 停掉每秒的计时刷新和所有循环动画；回来时先补画一次
let clockTimer = 0;
let slowTimer = 0;
let dotTimer = 0;
S.hostHidden = false;
function setIdle() {
  if (TOAST || MENU) return; // 提醒卡的倒计时靠动画走，不能暂停；菜单只在看得见时存在
  const idle = S.hostHidden || (document.hidden && !pip.win) || (S.dock.tucked && !visible().some(s => s.status === 'running'));
  if (idle === S.idle) return;
  S.idle = idle;
  document.documentElement.toggleAttribute('data-idle', idle);
  clearInterval(clockTimer);
  clearInterval(slowTimer);
  clearInterval(dotTimer);
  if (!idle) {
    tickClocks(document);
    clockTimer = setInterval(() => tickClocks(document), 1000);
    // 点阵：7 拍一轮（5 拍扫过对角线 + 停 2 拍）；页面上没有进行中的点阵时什么也不改
    let ph = 0;
    dotTimer = setInterval(() => {
      ph = (ph + 1) % 7;
      for (const doc of [document, pip.win?.document]) {
        // 只改点阵图标自己的属性：改在 <html> 上会让整页每 140ms 重算一遍样式
        if (doc) for (const el of doc.getElementsByClassName('dmx')) el.dataset.ph = ph;
      }
    }, 140);
    let actN = 0;
    slowTimer = setInterval(() => { // “没动静”“刚结束”这类随时间变化的分组
      // 有会话 8 分钟以上没报进度时，每分钟看一次它的对话记录还有没有动静（区分在跑长命令和真停了）
      if (actN++ % 2 === 0 && S.conn === 'live' && visible().some(s => (s.status === 'running' || s.status === 'planning') && now() - s.updatedAt > 8 * MIN))
        fetch('/api/activity').then(r => r.json()).then(a => { S.activity = a; schedule(); }).catch(() => {});
      else schedule();
    }, 30e3);
    schedule();
  }
}
S.idle = null;
setIdle();
document.addEventListener('visibilitychange', setIdle);
// 宿主在显示 / 隐藏窗口时调用。藏起来时把“刚结束”和转盘收回去，下次出来是干净的
window.tickVisible = on => {
  S.hostHidden = !on;
  if (!on) { S.histOpen = false; S.staleOpen = false; S.agentsOpen = false; if (S.fan) { S.fan = false; S.fanRestore?.(); } schedule(); }
  setIdle();
};

// ============ 启动 ============
(async () => {
  window.__tick = { S, PERF, render, edgeBeam }; // 本机调试和压测用
  // 提醒卡和面板没有宿主推的状态，主题色从 health 里取（悬浮窗和菜单之后还会收到宿主推的）
  if (!MENU) fetch('/api/health').then(r => r.json()).then(h => setTheme(h.theme)).catch(() => {});
  if (TOAST) { document.title = tr('Tick 提醒'); startToast(); return; }
  if (MENU) { document.title = tr('Tick 菜单'); startMenu(); return; }
  if (PEEK) { document.title = 'Tick 未读'; startPeek(); return; }
  if (FLOAT) document.title = tr('Tick 小窗');
  if (NATIVE) {
    try { const st = await window.tickState(); S.pinned = st.pinned; S.compact = st.compact; S.dnd = !!st.dnd; S.hotkey = st.hotkey || ''; } catch { /* 用默认值 */ }
  } else if (FLOAT) {
    S.compact = qs.has('pill') || store.get('compact', false);
  }
  await connect();
  if (NATIVE) {
    window.tickReady();
    setInterval(() => window.tickBeat?.(), 15000); // 心跳：宿主 90 秒收不到就重新加载页面
  }
  // 按 #guide / #<会话> 跳转。宿主把已开着的面板叫到前面时直接调 tickGo：
  // 只改 location.hash 的话，值和上次一样就不触发 hashchange，面板停在列表上
  const route = h => { if (h === 'guide') openGuide(); else if (h && S.sessions.has(h)) openSession(h, false); };
  window.tickGo = h => { route(h.replace(/^#/, '')); };
  route(location.hash.slice(1));
  window.addEventListener('hashchange', () => route(location.hash.slice(1)));
})();
})();
</script>
